<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星火日历 · 中共党史大事记</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", SimSun, sans-serif;
        }
        body {
            background-color: #f7f7f7;
            color: #222;
            padding: 20px;
        }
        .container {
            max-width: 1760px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: #b22222;
            margin-bottom: 12px;
            font-size: 28px;
        }
        /* 工具栏：两行，搜索在上、年份在下，彼此隔离 */
        .toolbar {
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
            margin-bottom: 6px;
        }
        .toolbar-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            align-items: center;
        }
        .toolbar input, .toolbar button {
            padding: 8px 12px;
            font-size: 14px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }
        /* 搜索框可伸缩，按钮自动换行，避免窄屏（手机端）横向溢出 */
        .toolbar input { flex: 1 1 180px; min-width: 0; }
        .toolbar button { flex: 0 0 auto; }
        .toolbar button {
            background: #b22222;
            color: #fff;
            border: none;
            cursor: pointer;
        }
        #searchInput { min-width: 240px; }

        /* 年份选择器（点击年份弹出年份列表） */
        .year-select {
            position: relative;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .ylabel { font-size: 13px; color: #666; }
        /* 提升特异性以压过 .toolbar button（修复悬浮文字不可读） */
        .toolbar .year-nav {
            width: 30px; height: 30px;
            border-radius: 6px;
            border: 1px solid #ccc;
            background: #f4f4f4;
            color: #b22222;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            line-height: 1;
        }
        .toolbar .year-nav:hover { background: #ffecec; color: #b22222; }
        .toolbar .year-label {
            min-width: 96px;
            text-align: center;
            font-size: 16px;
            font-weight: bold;
            color: #b22222;
            cursor: pointer;
            user-select: none;
            background: #fff;
            border: 1px solid #e0c0c0;
            border-radius: 6px;
            padding: 5px 8px;
        }
        .toolbar .year-label:hover { background: #fff5f5; color: #b22222; }
        .year-label .caret { font-size: 12px; }
        .year-dropdown {
            position: absolute;
            top: 115%;
            left: 50%;
            transform: translateX(-50%);
            background: #fff;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-shadow: 0 6px 16px #00000030;
            padding: 6px;
            z-index: 50;
            display: none;
            max-height: 300px;
            overflow: auto;
            width: 150px;
            grid-template-columns: repeat(2, 1fr);
            gap: 4px;
        }
        .year-dropdown.show { display: grid; }
        .year-option {
            position: relative;
            padding: 6px 4px;
            text-align: center;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            color: #333;
        }
        .year-option:hover { background: #ffecec; color: #b22222; }
        .year-option.sel { background: #b22222; color: #fff; }

        .hint {
            text-align: center;
            color: #888;
            font-size: 12px;
            margin: 8px 0 12px;
            line-height: 1.6;
        }
        /* 图例色块：红=中共、蓝=其他力量（国民党/国民政府等） */
        .hint .lg { font-size: 11px; margin: 0 2px 0 8px; }
        .hint .lg-party { color: #b22222; }
        .hint .lg-kmt { color: #1a5276; }
        #statusText {
            color: #b22222;
            font-size: 13px;
            min-height: 18px;
            text-align: center;
            display: block;
            margin-bottom: 10px;
        }
        .main-wrap {
            display: flex;
            gap: 16px;
        }
        .month-sidebar {
            width: 140px;
            background: #fff;
            border-radius: 8px;
            padding: 12px;
            height: fit-content;
            box-shadow: 0 1px 4px #00000020;
        }
        .month-btn {
            position: relative;
            display: block;
            width: 100%;
            padding: 10px 8px;
            margin: 4px 0;
            border: none;
            background: #eee;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            color: #333;
            text-align: center;
            transition: 0.15s;
        }
        /* 选中月份：用中性深灰高亮，与"红=中共/蓝=其他力量"的主题色明确区分 */
        .month-btn.active {
            background: #3a3a3a !important;
            color: #fff !important;
            box-shadow: 0 0 0 2px #888;
        }
        /* 数量角标：默认左上角小红字；年份选择器里改为右上角小角标，避免挤压年份文字 */
        .count-badge {
            position: absolute;
            top: 2px;
            left: 4px;
            background: #fff;
            color: #b22222;
            border: 1px solid #e0c0c0;
            border-radius: 9px;
            font-size: 10px;
            font-weight: bold;
            line-height: 1;
            padding: 1px 4px;
            min-width: 13px;
            text-align: center;
        }
        /* 年份选项里的角标：缩到右上角，绝不影响年份居中显示 */
        .year-option .count-badge {
            left: auto;
            right: 3px;
            top: 1px;
            font-size: 9px;
            padding: 0 3px;
            min-width: 11px;
            border-radius: 7px;
        }
        .calendar-box {
            flex: 1;
            background: #ffffff;
            border-radius: 10px;
            padding: 16px;
            box-shadow: 0 1px 6px #00000018;
        }
        .week-title {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            margin-bottom: 8px;
        }
        .week-title div {
            text-align: center;
            padding: 8px;
            font-weight: bold;
            color: #666;
        }
        .date-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
        }
        .day-cell {
            min-height: 130px;
            border: 1px solid #e5e5e5;
            border-radius: 6px;
            padding: 8px;
            position: relative;
            cursor: pointer;
            transition: 0.2s;
            background: #ffffff;
        }
        .day-cell:hover {
            border-color: #b22222;
            box-shadow: 0 0 0 2px rgba(178,34,34,0.15);
        }
        .day-num {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 6px;
            color: #8b1a1a;
        }
        .event-item {
            font-size: 12px;
            line-height: 1.45;
            color: #222;
            margin-bottom: 4px;
            border-left: 2px solid #b22222;
            padding-left: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .empty-day {
            background: #fafafa !important;
            opacity: 0.5;
            cursor: default;
            box-shadow: none;
            border-color: #eee;
        }
        .empty-day .day-num { color: #bbb; }
        /* 弹窗样式 */
        .modal-mask {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 999;
        }
        .modal-box {
            width: min(600px, 90%);
            background: #fff;
            border-radius: 10px;
            padding: 20px;
        }
        .modal-box h3 {
            color: #b22222;
            margin-bottom: 12px;
        }
        .modal-event {
            padding: 8px 0 8px 10px;
            border-bottom: 1px solid #eee;
            border-left: 3px solid #b22222;
        }
        /* 弹窗中属于其他力量（蓝色主题）的事件，左侧改蓝 */
        .modal-event.kmt { border-left-color:#1a5276; }
        .close-modal {
            margin-top: 14px;
            padding: 8px 16px;
            background: #b22222;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        /* 关于弹窗：更新日志 + 操作指南 */
        .about-tabs { display:flex; gap:8px; margin-bottom:14px; border-bottom:1px solid #eee; }
        .about-tab { flex:1; padding:8px 0; background:none; border:none; border-bottom:2px solid transparent; cursor:pointer; font-size:14px; color:#666; }
        .about-tab.active { color:#b22222; border-bottom-color:#b22222; font-weight:600; }
        .about-body { max-height:62vh; overflow:auto; line-height:1.7; font-size:14px; color:#333; }
        .about-body h4 { color:#b22222; margin:16px 0 6px; font-size:15px; }
        .about-body h4:first-child { margin-top:0; }
        .about-body ul { margin:6px 0 6px 18px; padding:0; }
        .about-body li { margin:4px 0; }
        .about-body .ver { color:#b22222; font-weight:700; }
        .about-body small { color:#999; font-weight:400; margin-left:6px; }
        .about-body code { background:#f4f4f4; padding:1px 5px; border-radius:4px; font-size:13px; }
        [data-theme="dark"] .about-body { color:#d0d0d0; }
        [data-theme="dark"] .about-body h4 { color:#e57373; }
        [data-theme="dark"] .about-body .ver { color:#e57373; }
        [data-theme="dark"] .about-tab { color:#aaa; }
        [data-theme="dark"] .about-tabs { border-bottom-color:#444; }
        [data-theme="dark"] .about-body code { background:#2a2a2a; }
        @media (max-width: 768px){
            .main-wrap { flex-direction: column; }
            .month-sidebar { width: 100%; display: grid; grid-template-columns: repeat(6, 1fr); }
            .day-cell { min-height: 100px; }
            .year-select { order: -1; }
        }

        /* ===================== 模式切换（标题处入口） ===================== */
        .mode-switch { text-align:center; margin-bottom:14px; }
        .mode-btn {
            padding:7px 18px; font-size:14px;
            border:1px solid #b22222; background:#fff; color:#b22222;
            cursor:pointer; transition:0.15s;
        }
        .mode-btn:first-child { border-radius:6px 0 0 6px; }
        .mode-btn:last-child { border-radius:0 6px 6px 0; border-left:none; }
        .mode-btn:hover { background:#fff5f5; }
        .mode-btn.active { background:#b22222; color:#fff; }
        .mode-btn.active:hover { background:#9e1d1d; }

        /* 参考文献入口按钮（emoji 风格，区别于操作按钮） */
        .ref-btn {
            background:#fff !important; color:#b22222 !important;
            border:1px solid #b22222 !important; font-size:14px;
        }
        .ref-btn:hover { background:#fff5f5 !important; }
        .ref-btn.active { background:#b22222 !important; color:#fff !important; }
        [data-theme="dark"] .ref-btn.active { background:#e57373 !important; color:#1a1a1a !important; }

        /* ===================== 时间轴模式 ===================== */
        .tl-view { display:none; }
        .tl-view.show {
            display:block;
            /* 横向填满页面：突破 .container 的居中限制，触达视口左右边缘 */
            width:auto;
            margin-left:calc(50% - 50vw);
            margin-right:calc(50% - 50vw);
        }
        .tl-toolbar {
            text-align:center; margin-bottom:10px; font-size:13px;
        }
        .tl-toolbar .tl-hint { color:#888; }
        .tl-toolbar .tl-hint-sep { color:#ccc; margin:0 6px; }
        .tl-scroll {
            overflow-x:auto; overflow-y:hidden;
            border:1px solid #e5e5e5; border-radius:10px;
            background:#fff; position:relative;
            cursor:grab; -webkit-overflow-scrolling:touch;
        }
        .tl-scroll.dragging { cursor:grabbing; }
        .tl-scroll.dragging * { user-select:none; }
        .tl-track {
            position:relative; display:inline-flex; align-items:stretch;
            min-width:100%; height:calc(100vh - 200px); min-height:560px;
            padding:0; /* 去掉两侧内边距，使左右说明面板触达时间轴容器边缘，充分利用空白 */
        }
        .tl-axis {
            position:absolute; left:0; right:0; top:50%;
            height:2px; background:#e6c9c9; transform:translateY(-1px);
        }
        .tl-item {
            position:relative; flex:0 0 230px; width:230px;
        }
        .tl-dot {
            position:absolute; left:50%; top:50%;
            transform:translate(-50%,-50%);
            width:13px; height:13px; border-radius:50%;
            background:#b22222; border:2px solid #fff;
            box-shadow:0 0 0 1px #b22222; z-index:2;
        }
        .tl-card {
            position:absolute; left:14px; right:14px;
            max-height:calc(50% - 68px); overflow:hidden;
            background:#fff7f7; border:1px solid #f0d4d4;
            border-left:3px solid #b22222;
            border-radius:6px; padding:10px 12px; cursor:pointer;
            box-shadow:0 1px 3px #00000018; z-index:3; transition:0.15s;
        }
        .tl-card:hover { box-shadow:0 0 0 2px rgba(178,34,34,0.25); }
        .tl-card .tl-date { color:#b22222; font-weight:bold; font-size:13px; }
        .tl-card .tl-title { color:#222; margin-top:3px; font-size:14px; line-height:1.4; font-weight:bold; }
        .tl-card .tl-desc {
            color:#666; margin-top:4px; font-size:12px; line-height:1.5;
            display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;
        }
        /* 卡片靠轴线的边缘与轴线保持固定间隙（桌面端 56px，即原 28px 的两倍），由 bottom/top 定位保证上下对称 */
        .tl-item.up .tl-card { bottom:calc(50% + 56px); top:auto; }
        .tl-item.down .tl-card { top:calc(50% + 56px); bottom:auto; }
        .tl-link {
            position:absolute; left:50%; width:2px; background:#e6c9c9;
            transform:translateX(-50%); z-index:1;
        }
        /* 连线固定短距：只从卡片靠轴线边缘连到轴上圆点，长度恒定，不受卡片长短影响 */
        .tl-item.up .tl-link { top:calc(50% - 56px); height:56px; bottom:auto; }
        .tl-item.down .tl-link { top:50%; height:56px; bottom:auto; }
        /* 蓝色主题：与中共无直接因果、主体为其他力量（国民党/国民政府等）的事件 */
        .tl-item.kmt .tl-card { background:#eef4f8; border-color:#c5dbea; border-left-color:#1a5276; }
        .tl-item.kmt .tl-card .tl-date { color:#1a5276; }
        .tl-item.kmt .tl-dot { background:#1a5276; box-shadow:0 0 0 1px #1a5276; }
        .tl-item.kmt .tl-link { background:#cde0ec; }
        .tl-year {
            position:relative; flex:0 0 60px; width:60px;
            display:flex; align-items:center; justify-content:center;
        }
        .tl-year::before {
            content:""; position:absolute; left:50%; top:0; bottom:0;
            width:2px; background:#cde0ec; transform:translateX(-50%);
        }
        .tl-year span {
            writing-mode:vertical-rl; color:#1a5276; font-weight:bold;
            font-size:15px; letter-spacing:3px; background:#eef4f8;
            border-radius:6px; padding:10px 4px; z-index:2;
        }
        /* 左/右端面板：利用时间轴两侧空白区域 */
        .tl-intro, .tl-outro {
            flex:0 0 280px; width:280px;
            display:flex; flex-direction:column; justify-content:center;
            padding:0 26px; z-index:3;
        }
        .tl-intro { border-right:2px dashed #e0c0c0; }
        .tl-outro { border-left:2px dashed #e0c0c0; align-items:flex-end; text-align:right; }
        .tl-intro h2 { color:#b22222; font-size:22px; margin-bottom:8px; }
        .tl-intro .sub { color:#1a5276; font-size:16px; font-weight:bold; margin-bottom:16px; }
        .tl-intro p, .tl-outro p { color:#666; font-size:13px; line-height:1.8; margin-bottom:8px; }
        .tl-outro h3 { color:#b22222; font-size:20px; margin-bottom:12px; }
        @media (max-width: 768px){
            .tl-track { height:calc(100vh - 190px); min-height:480px; }
            .tl-item { flex:0 0 170px; width:170px; }
            /* 手机端缩小左右说明面板，避免挤占事件卡片横向空间 */
            .tl-intro, .tl-outro { flex:0 0 116px; width:116px; padding:0 8px; }
            .tl-intro h2 { font-size:15px; }
            .tl-intro .sub { font-size:13px; margin-bottom:10px; }
            .tl-intro p, .tl-outro p { font-size:11px; line-height:1.5; margin-bottom:5px; }
            .tl-outro h3 { font-size:16px; }
            /* 移动端：卡片内边距与字号收敛，连线间隙加长到 44px（移动端，即原 22px 的两倍），保证窄卡片内文字完整不溢出 */
            .tl-card { padding:8px 9px; }
            .tl-card .tl-title { font-size:12.5px; }
            .tl-card .tl-desc { font-size:11px; -webkit-line-clamp:2; }
            .tl-item.up .tl-card { bottom:calc(50% + 44px); }
            .tl-item.down .tl-card { top:calc(50% + 44px); }
            .tl-item.up .tl-link { top:calc(50% - 44px); height:44px; }
            .tl-item.down .tl-link { top:50%; height:44px; }
        }
        @media (max-width: 480px){
            .tl-item { flex:0 0 150px; width:150px; }
            .tl-intro, .tl-outro { flex:0 0 96px; width:96px; padding:0 6px; }
            .tl-intro h2 { font-size:13px; }
            .tl-intro .sub { font-size:12px; }
            .tl-card { padding:7px 8px; }
            .tl-card .tl-title { font-size:12px; }
            .tl-card .tl-desc { font-size:10.5px; }
        }

        /* ===================== 重要会议（emoji 入口 + 筛选） ===================== */
        .mtg-filter { display:flex; flex-wrap:wrap; gap:8px; margin:6px 0 14px; }
        .mtg-fbtn {
            padding:6px 13px; border:1px solid #b22222; background:#fff; color:#b22222;
            border-radius:16px; cursor:pointer; font-size:13px; transition:0.15s;
        }
        .mtg-fbtn:hover { background:#fff5f5; }
        .mtg-fbtn.active { background:#b22222; color:#fff; }
        .mtg-list { max-height:52vh; overflow:auto; padding-right:4px; }
        .mtg-card {
            padding:10px 12px; border-left:3px solid #b22222; margin-bottom:10px;
            background:#fff7f7; border-radius:0 6px 6px 0;
        }
        /* 中央全会类用蓝色系，与其他类（黄色系）区分 */
        .mtg-card.mtg-plenum { border-left-color:#1a5276; background:#eef4f8; }
        .mtg-card.mtg-other  { border-left-color:#b8860b; background:#fbf6e9; }
        .mtg-card-h { font-weight:bold; color:#b22222; font-size:14px; }
        .mtg-card.mtg-plenum .mtg-card-h { color:#1a5276; }
        .mtg-card.mtg-other  .mtg-card-h { color:#9c6b08; }
        .mtg-card-d { color:#555; font-size:13px; line-height:1.6; margin-top:4px; }
        /* 会议卡片可点击 -> 详细内容弹窗 */
        .mtg-card { cursor:pointer; transition:0.15s; }
        .mtg-card:hover { box-shadow:0 0 0 2px rgba(178,34,34,0.16); }
        .mtg-card.mtg-plenum:hover { box-shadow:0 0 0 2px rgba(26,82,118,0.16); }
        .mtg-card.mtg-other:hover { box-shadow:0 0 0 2px rgba(184,134,11,0.18); }
        .mtg-card-more { margin-top:6px; font-size:12px; color:#b22222; }
        .mtg-card.mtg-plenum .mtg-card-more { color:#1a5276; }
        .mtg-card.mtg-other .mtg-card-more { color:#9c6b08; }
        .mtg-detail-back { margin-bottom:12px; padding:6px 12px; border:1px solid #b22222; background:#fff; color:#b22222; border-radius:6px; cursor:pointer; font-size:13px; }
        .mtg-detail-back:hover { background:#fff5f5; }
        .mtg-detail-type { display:inline-block; padding:2px 10px; border-radius:10px; font-size:12px; color:#fff; margin-bottom:8px; }
        .mtg-detail-type.congress { background:#b22222; }
        .mtg-detail-type.plenum { background:#1a5276; }
        .mtg-detail-type.other { background:#b8860b; }
        .mtg-detail-date { color:#888; font-size:13px; margin-bottom:10px; }
        .mtg-detail-desc { color:#333; font-size:15px; line-height:1.8; margin-bottom:6px; }
        .mtg-rel-h { font-weight:bold; color:#b22222; margin:14px 0 8px; }


        /* ===================== 夜间模式 ===================== */
        [data-theme="dark"] body { background:#161616; color:#e0e0e0; }
        [data-theme="dark"] h1 { color:#e57373; }
        [data-theme="dark"] .hint { color:#9a9a9a; }
        [data-theme="dark"] .ylabel { color:#aaa; }
        [data-theme="dark"] #statusText { color:#e57373; }

        [data-theme="dark"] .month-sidebar,
        [data-theme="dark"] .calendar-box,
        [data-theme="dark"] .modal-box,
        [data-theme="dark"] .year-dropdown { background:#242424; box-shadow:0 1px 6px #00000060; }

        [data-theme="dark"] .toolbar input { background:#242424; color:#e0e0e0; border-color:#444; }
        [data-theme="dark"] .toolbar button { background:#b22222; color:#fff; }
        [data-theme="dark"] .ref-btn { background:#242424 !important; color:#e57373 !important; border-color:#b22222 !important; }
        [data-theme="dark"] .ref-btn:hover { background:#2e2424 !important; }

        [data-theme="dark"] .mode-btn { background:#242424; color:#e57373; border-color:#b22222; }

        [data-theme="dark"] .tl-axis { background:#4a3a3a; }

        [data-theme="dark"] .tl-card .tl-date { color:#e57373; }
        [data-theme="dark"] .tl-card .tl-title { color:#e0e0e0; }
        [data-theme="dark"] .tl-card .tl-desc { color:#9a9a9a; }

        [data-theme="dark"] .tl-intro p, [data-theme="dark"] .tl-outro p { color:#9a9a9a; }

        [data-theme="dark"] .tl-card:hover { box-shadow:0 0 0 2px rgba(229,115,115,0.3); }
        [data-theme="dark"] .tl-dot { background:#e57373; border-color:#1f1f1f; box-shadow:0 0 0 1px #e57373; }
        [data-theme="dark"] .tl-link { background:#4a3a3a; }
        [data-theme="dark"] .tl-year::before { background:#2a3a45; }
        [data-theme="dark"] .tl-year span { background:#1f2b33; color:#7fb3d5; }
        /* 夜间模式：蓝色主题事件 */
        [data-theme="dark"] .tl-item.kmt .tl-card { background:#1f2b33; border-color:#2a3a45; border-left-color:#5dade2; }
        [data-theme="dark"] .tl-item.kmt .tl-card .tl-date { color:#5dade2; }
        [data-theme="dark"] .tl-item.kmt .tl-dot { background:#5dade2; box-shadow:0 0 0 1px #5dade2; }
        [data-theme="dark"] .tl-item.kmt .tl-link { background:#2a3a45; }
        /* 夜间模式：重要会议弹窗 */
        [data-theme="dark"] .mtg-fbtn { background:#242424; color:#e57373; border-color:#b22222; }
        [data-theme="dark"] .mtg-fbtn.active { background:#b22222; color:#fff; }

        [data-theme="dark"] .mtg-card.mtg-plenum { background:#1f2b33; border-left-color:#5dade2; }
        [data-theme="dark"] .mtg-card.mtg-other { background:#2a2620; border-left-color:#caa84a; }
        [data-theme="dark"] .mtg-card-h { color:#e57373; }
        [data-theme="dark"] .mtg-card.mtg-plenum .mtg-card-h { color:#5dade2; }
        [data-theme="dark"] .mtg-card.mtg-other .mtg-card-h { color:#caa84a; }
        [data-theme="dark"] .mtg-card-d { color:#9a9a9a; }
        [data-theme="dark"] .mtg-card:hover { box-shadow:0 0 0 2px rgba(229,115,115,0.22); }
        [data-theme="dark"] .mtg-card.mtg-plenum:hover { box-shadow:0 0 0 2px rgba(93,173,226,0.22); }
        [data-theme="dark"] .mtg-card.mtg-other:hover { box-shadow:0 0 0 2px rgba(202,168,74,0.24); }

        [data-theme="dark"] .mtg-card.mtg-plenum .mtg-card-more { color:#5dade2; }
        [data-theme="dark"] .mtg-card.mtg-other .mtg-card-more { color:#caa84a; }
        [data-theme="dark"] .mtg-detail-back { background:#2a2a2e; color:#e57373; border-color:#e57373; }
        [data-theme="dark"] .mtg-detail-back:hover { background:#322326; }
        [data-theme="dark"] .mtg-detail-date { color:#9a9a9a; }
        [data-theme="dark"] .mtg-detail-desc { color:#ddd; }
        [data-theme="dark"] .mtg-rel-h { color:#e57373; }
        /* ===================== 左右侧栏（利用页面两侧空白区域） ===================== */
        /* 日历主体：居中显示，不占满整屏 */
        .stage {
            max-width: 1500px;
            margin: 10px auto 0;
        }
        /* 选中年份事件速览：默认缩小为右上角按钮，点击后再展开 */
        .rail-toggle {
            position: fixed;
            top: 8px; right: 8px; z-index: 60;
            cursor: pointer; border: none;
            background: #b22222; color: #fff;
            border-radius: 18px; padding: 7px 14px;
            font-size: 13px; font-weight: bold;
            box-shadow: 0 2px 8px #00000033;
            display: flex; align-items: center; gap: 6px;
            transition: 0.15s;
        }
        .rail-toggle:hover { background: #9a1d1d; }
        .rail-toggle .badge {
            background: rgba(255,255,255,0.25); border-radius: 10px;
            padding: 1px 7px; font-size: 12px; font-weight: bold;
        }
        .rail-toggle .chev { font-size: 10px; line-height: 1; }
        .rail-right {
            position: fixed;
            top: 52px;
            right: 8px;
            width: 320px;
            max-height: calc(100vh - 130px);
            z-index: 50;
            overflow: auto;
            background: #fff;
            border-radius: 8px;
            padding: 14px;
            box-shadow: 0 2px 12px #00000022;
            display: none;
        }
        .rail-right.open { display: block; }
        .rail-close {
            float: right; border: none; background: transparent;
            color: #b22222; font-size: 18px; line-height: 1; cursor: pointer;
            padding: 0 2px; margin: -2px 0 0 2px;
        }
        .rail-close:hover { color: #9a1d1d; }
        .rail-card {
            background: transparent;
            border-radius: 0;
            padding: 0;
            box-shadow: none;
            margin-bottom: 0;
        }
        .rail-h { color: #b22222; font-size: 15px; margin-bottom: 10px; }
        .rail-stats { display: flex; gap: 8px; margin-bottom: 12px; }
        .rail-stat {
            flex: 1; text-align: center; background: #fbeeee;
            border-radius: 6px; padding: 8px 2px;
        }
        .rail-stat .n { font-size: 20px; font-weight: bold; color: #b22222; line-height: 1.2; }
        .rail-stat .l { font-size: 11px; color: #888; }
        .rail-stat.alt { background: #eef4f8; }
        .rail-stat.alt .n { color: #1a5276; }
        .rail-list { padding-right: 2px; }
        .rail-item {
            padding: 8px 10px; border-left: 3px solid #b22222; background: #fff7f7;
            border-radius: 4px; margin-bottom: 6px; cursor: pointer; transition: 0.15s;
        }
        .rail-item:hover { box-shadow: 0 0 0 2px rgba(178,34,34,0.18); }
        .rail-item.kmt { border-left-color: #1a5276; background: #eef4f8; }
        .rail-item .ri-date { font-size: 11px; color: #b22222; font-weight: bold; }
        .rail-item.kmt .ri-date { color: #1a5276; }
        .rail-item .ri-title { font-size: 13px; color: #222; margin-top: 2px; line-height: 1.4; }
        /* 窄屏适配：右上角按钮+面板保持固定，缩小避免遮挡主内容 */
        @media (max-width: 1100px){
            .rail-right { width: 286px; top: 52px; right: 8px; padding: 12px; }
            .rail-list { max-height: 62vh; }
        }
        @media (max-width: 700px){
            .rail-toggle { padding: 6px 11px; font-size: 12px; }
            .rail-right { width: min(86vw, 320px); top: 48px; right: 6px; max-height: calc(100vh - 112px); }
            .rail-list { max-height: 58vh; }
        }
        /* 暗色模式适配 */
        [data-theme="dark"] .rail-right { background: #232427; box-shadow: 0 2px 12px #00000066; }
        [data-theme="dark"] .rail-toggle { background: #e57373; color: #1a1a1a; }
        [data-theme="dark"] .rail-toggle:hover { background: #d96363; }
        [data-theme="dark"] .rail-toggle .badge { background: rgba(0,0,0,0.2); }
        [data-theme="dark"] .rail-close { color: #e57373; }
        [data-theme="dark"] .rail-close:hover { color: #d96363; }
        [data-theme="dark"] .rail-h { color: #e57373; }
        [data-theme="dark"] .rail-stat { background: #33282a; }
        [data-theme="dark"] .rail-stat.alt { background: #233240; }
        [data-theme="dark"] .rail-stat .l { color: #9a9a9a; }
        [data-theme="dark"] .rail-item { background: #2a2325; }
        [data-theme="dark"] .rail-item.kmt { background: #1f2e3a; }
        [data-theme="dark"] .rail-item .ri-title { color: #ddd; }

        /* ===== 第三行：分类筛选 + 年份范围 + 快捷入口 ===== */
        .filter-row { gap: 10px; }
        .cat-chips { display: inline-flex; flex-wrap: wrap; gap: 6px; }
        .chip {
            padding: 5px 12px; font-size: 13px; border-radius: 14px;
            border: 1px solid #d9b3b3; background: #fff; color: #b22222; cursor: pointer;
            transition: 0.15s;
        }
        .chip:hover { background: #fff5f5; }
        .chip.active { background: #b22222; color: #fff; border-color: #b22222; }
        .yr-range { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; color: #666; }
        .yr-range input {
            width: 64px; padding: 5px 6px; font-size: 13px; border-radius: 6px;
            border: 1px solid #ccc; text-align: center;
        }
        .yr-range label { color: #888; }
        .ghost-btn {
            padding: 6px 12px; font-size: 13px; border-radius: 6px;
            border: 1px solid #b22222; background: #fff; color: #b22222; cursor: pointer;
            transition: 0.15s;
        }
        .ghost-btn:hover { background: #fff5f5; }
        .badge-count {
            display: inline-block; min-width: 16px; padding: 0 4px; font-size: 11px; line-height: 16px;
            text-align: center; background: #b22222; color: #fff; border-radius: 8px;
        }
        /* 暗色 */
        [data-theme="dark"] .chip { background: #242424; color: #e57373; border-color: #5a3a3a; }
        [data-theme="dark"] .chip:hover { background: #2e2424; }
        [data-theme="dark"] .chip.active { background: #e57373; color: #1a1a1a; border-color: #e57373; }
        [data-theme="dark"] .yr-range { color: #9a9a9a; }
        [data-theme="dark"] .yr-range input { background: #242424; color: #e0e0e0; border-color: #444; }
        [data-theme="dark"] .ghost-btn { background: #242424; color: #e57373; border-color: #b22222; }
        [data-theme="dark"] .ghost-btn:hover { background: #2e2424; }
        [data-theme="dark"] .badge-count { background: #e57373; color: #1a1a1a; }

        /* ===== 弹窗事件：收藏星标 + 来源 + 交叉关联 ===== */
        .modal-event { position: relative; }
        .fav-star {
            position: absolute; top: 8px; right: 10px; cursor: pointer; font-size: 16px;
            color: #c9c9c9; user-select: none; transition: 0.15s; line-height: 1;
        }
        .fav-star:hover { transform: scale(1.2); }
        .fav-star.on { color: #f1c40f; }
        .ev-source {
            margin-top: 8px; padding-top: 6px; border-top: 1px dashed #e3c9c9;
            font-size: 12px; color: #a07a7a; line-height: 1.5;
        }
        .ev-rel { margin-top: 10px; }
        .ev-rel-h { font-size: 13px; font-weight: bold; color: #b22222; margin-bottom: 5px; }
        .rel-chip {
            display: inline-block; margin: 0 6px 6px 0; padding: 4px 9px; font-size: 12px;
            border-radius: 12px; background: #fbeeee; color: #b22222; cursor: pointer;
            border: 1px solid #eccaca; transition: 0.15s; max-width: 100%;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; vertical-align: middle;
        }
        .rel-chip:hover { background: #f6dcdc; }
        .rel-chip.kmt { background: #eef4f8; color: #1a5276; border-color: #c5dbea; }
        .rel-chip.kmt:hover { background: #e0ecf4; }
        .rel-empty { font-size: 12px; color: #aaa; margin-top: 6px; }
        /* 因果脉络（弹窗内） */
        .ev-causal { margin-top: 10px; border-top: 1px dashed #eee; padding-top: 8px; }
        .causal-sub { font-size: 12px; color: #888; margin: 4px 0 3px; }
        .causal-chip {
            display: inline-block; margin: 0 6px 6px 0; padding: 4px 9px; font-size: 12px;
            border-radius: 12px; background: #eaf3ea; color: #1e7a36; cursor: pointer;
            border: 1px solid #c7e3c7; transition: 0.15s; max-width: 100%;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; vertical-align: middle;
        }
        .causal-chip:hover { background: #d8efd8; }
        .causal-chip.kmt { background: #eef4f8; color: #1a5276; border-color: #c5dbea; }
        .causal-chip.kmt:hover { background: #e0ecf4; }
        .causal-act { margin-top: 4px; }
        .causal-link-btn {
            font-size: 12px; padding: 4px 10px; border-radius: 12px; cursor: pointer;
            background: #fff; color: #b22222; border: 1px solid #e0b0b0; transition: 0.15s;
        }
        .causal-link-btn:hover { background: #fbeeee; }
        /* 时间轴「因果脉络」工具栏按钮 */
        .tl-btn {
            font-size: 12px; padding: 3px 12px; border-radius: 12px; cursor: pointer;
            background: #fff; color: #b22222; border: 1px solid #e0b0b0; margin-left: 4px; transition: 0.15s;
        }
        .tl-btn:hover { background: #fbeeee; }
        .tl-btn.active { background: #b22222; color: #fff; border-color: #b22222; }
        .tl-toolbar .tl-hint-sep, .tl-toolbar #tlCausalStatus { margin-left: 2px; }
        /* 时间轴因果高亮：相关事件描边/底色，根事件更强 */
        .tl-item.causal-hl .tl-card {
            border-color: #2e8b57; border-left-color: #1e7a36;
            background: #f1faf2; box-shadow: 0 0 0 2px rgba(30,122,54,0.25);
        }
        .tl-item.causal-hl .tl-dot { background: #1e7a36; box-shadow: 0 0 0 1px #1e7a36; }
        .tl-item.causal-hl .tl-link { background: #bfe3c8; }
        .tl-item.causal-root .tl-card {
            border-color: #b22222; border-left-color: #b22222;
            background: #fff0f0; box-shadow: 0 0 0 3px rgba(178,34,34,0.35);
        }
        .tl-item.causal-root .tl-dot { background: #b22222; box-shadow: 0 0 0 2px rgba(178,34,34,0.4); }
        .tl-item.kmt.causal-hl .tl-card { background: #f1faf2; border-color: #2e8b57; border-left-color: #1e7a36; }
        /* 因果相关控件的暗色适配 */
        [data-theme="dark"] .ev-causal { border-top-color: #3a3a3a; }
        [data-theme="dark"] .causal-chip { background: #1f3326; color: #7fd6a0; border-color: #2a4536; }
        [data-theme="dark"] .causal-chip:hover { background: #27402f; }
        [data-theme="dark"] .causal-chip.kmt { background: #1f2e3a; color: #7fb3d5; border-color: #2a3a45; }
        [data-theme="dark"] .causal-link-btn { background: #2a2a2a; color: #e57373; border-color: #4a3434; }
        [data-theme="dark"] .causal-link-btn:hover { background: #3a2a2a; }
        [data-theme="dark"] .tl-btn { background: #2a2a2a; color: #e57373; border-color: #4a3434; }
        [data-theme="dark"] .tl-btn.active { background: #e57373; color: #1a1a1a; border-color: #e57373; }
        [data-theme="dark"] .tl-item.causal-hl .tl-card { background: #20302a; border-color: #3fae7a; border-left-color: #3fae7a; box-shadow: 0 0 0 2px rgba(63,174,122,0.3); }
        [data-theme="dark"] .tl-item.causal-hl .tl-dot { background: #3fae7a; box-shadow: 0 0 0 1px #3fae7a; }
        [data-theme="dark"] .tl-item.causal-hl .tl-link { background: #2f5a45; }
        [data-theme="dark"] .tl-item.kmt.causal-hl .tl-card { background: #20302a; border-color: #3fae7a; border-left-color: #3fae7a; }
        [data-theme="dark"] .tl-item.causal-root .tl-card { background: #3a2424; border-color: #e57373; border-left-color: #e57373; box-shadow: 0 0 0 3px rgba(229,115,115,0.4); }
        [data-theme="dark"] .tl-item.causal-root .tl-dot { background: #e57373; box-shadow: 0 0 0 2px rgba(229,115,115,0.5); }
        [data-theme="dark"] .fav-star { color: #555; }
        [data-theme="dark"] .fav-star.on { color: #f1c40f; }
        [data-theme="dark"] .ev-source { color: #8a6a6a; border-top-color: #444; }
        [data-theme="dark"] .ev-rel-h { color: #e57373; }
        [data-theme="dark"] .rel-chip { background: #33282a; color: #e57373; border-color: #4a3434; }
        [data-theme="dark"] .rel-chip:hover { background: #3e2e30; }
        [data-theme="dark"] .rel-chip.kmt { background: #1f2e3a; color: #7fb3d5; border-color: #2a3a45; }

        /* ===== 统计可视化 ===== */
        .stat-summary { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
        .stat-card { flex: 1 1 110px; text-align: center; background: #fbeeee; border-radius: 8px; padding: 10px; }
        .stat-card .n { font-size: 22px; font-weight: bold; color: #b22222; }
        .stat-card .l { font-size: 12px; color: #888; margin-top: 2px; }
        .stat-card.alt { background: #eef4f8; }
        .stat-card.alt .n { color: #1a5276; }
        .stat-card.amber { background: #fbf6e9; }
        .stat-card.amber .n { color: #b8860b; }
        .stat-chart-title { font-size: 13px; color: #666; margin: 6px 0 8px; }
        .stat-legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12px; color: #666; margin-bottom: 10px; }
        .stat-legend .lg { font-size: 13px; margin-right: 3px; }
        .lg-party { color: #b22222; }
        .lg-soft { color: #c9a227; }
        .lg-kmt { color: #1a5276; }
        .stat-chart { max-height: 320px; overflow: auto; padding-right: 4px; }
        .stat-row { display: flex; align-items: center; gap: 8px; margin-bottom: 3px; }
        .stat-row .yr { width: 46px; font-size: 12px; color: #777; text-align: right; flex: 0 0 auto; }
        .stat-bar-wrap { flex: 1; background: #f3f3f3; border-radius: 4px; overflow: hidden; }
        .stat-bar { display: flex; height: 16px; border-radius: 4px; overflow: hidden; }
        .stat-bar .seg { display: block; height: 100%; min-width: 0; }
        .seg-party { background: linear-gradient(90deg,#d9534f,#b22222); }
        .seg-soft  { background: linear-gradient(90deg,#e3c766,#c9a227); }
        .seg-kmt   { background: linear-gradient(90deg,#5dade2,#1a5276); }
        .stat-row .cnt { width: 34px; font-size: 12px; color: #555; flex: 0 0 auto; }
        [data-theme="dark"] .stat-card { background: #33282a; }
        [data-theme="dark"] .stat-card.alt { background: #233240; }
        [data-theme="dark"] .stat-card.amber { background: #2e2a20; }
        [data-theme="dark"] .stat-card .l { color: #9a9a9a; }
        [data-theme="dark"] .stat-chart-title { color: #9a9a9a; }
        [data-theme="dark"] .stat-legend { color: #b8b8b8; }
        [data-theme="dark"] .stat-bar-wrap { background: #333; }
        [data-theme="dark"] .seg-party { background: linear-gradient(90deg,#e57373,#c0392b); }

    /* ===== 因果网络关系图 ===== */

.cg-canvas { flex: 1; overflow: hidden; background: #fafafa; cursor: grab; position: relative; user-select: none; -webkit-user-select: none; touch-action: none; }

.cg-hint { padding: 6px 16px; font-size: 12px; color: #999; border-top: 1px solid #f0f0f0; }
/* D方案：因果图脉络侧栏列表 */
.cg-body { display: flex; flex: 1; min-height: 0; }

/* 列表收起后：贴右边显示一个拉起按钮 */

/* 平板及以下：整体收边、工具加大点按区、日历与弹窗防溢出 */
@media (max-width: 768px){

<div class="container">
    <h1>星火日历</h1>

        <button id="modeCalendar" class="mode-btn active">日历模式</button>
        <button id="modeTimeline" class="mode-btn">时间轴模式</button>
    </div>

    <!-- 第一行：搜索 + 导出 + 主题（与年份选择隔离） -->
    <div class="toolbar">
        <div class="toolbar-row">
            <input id="searchInput" placeholder="搜索事件关键词 / 年份（与下方年份选择相互独立）">

        </div>

        <div class="toolbar-row">
            <span class="ylabel">年份</span>

                <button class="year-nav" id="yearPrev" title="上一年">◀</button>

                <div class="year-dropdown" id="yearDropdown"></div>

        </div>
        <!-- 第三行：分类筛选 + 年份范围 + 快捷入口（体感强的新功能） -->
        <div class="toolbar-row filter-row">
            <div class="cat-chips" id="catChips">
                <button class="chip active" data-cat="all">全部</button>

const byDate = {};
historyData.forEach(e => { const k = e.year + '-' + e.month + '-' + e.day; (byDate[k] = byDate[k] || []).push(e); });
function keyOf(e){ return e.year + '-' + e.month + '-' + e.day; }
function eventsOfKey(k){ return byDate[k] || []; }
function causesOf(k){ return (CAUSAL[k] || []).map(eventsOfKey).flat(); }
function causedByOf(k){
  const res = [];
  for(const src in CAUSAL){ if((CAUSAL[src] || []).includes(k)) res.push(...eventsOfKey(src)); }
  return res;
}
// 因果闭包（上溯前因、下探后续，含传递关系），用于时间轴高亮
function causalClosure(k){
  const seen = new Set([k]); const q = [k];
  while(q.length){
    const cur = q.shift();
    const nxt = [...(CAUSAL[cur] || []), ...Object.keys(CAUSAL).filter(s => (CAUSAL[s] || []).includes(cur))];
    nxt.forEach(n => { if(!seen.has(n)){ seen.add(n); q.push(n); } });
  }
  return seen;
}
// ===================== 因果网络关系图（替代时间轴高亮的因果脉络展示） =====================
// 把「因果」建模为事件节点 + 有向边（因→果）的网络图；点击节点以它为新根高亮整条脉络。
const cgNodes = (() => {
  const set = new Set();
  for(const k in CAUSAL){ set.add(k); (CAUSAL[k] || []).forEach(t => set.add(t)); }
  for(const k in CAUSAL_INFERRED){ set.add(k); (CAUSAL_INFERRED[k] || []).forEach(t => set.add(t)); }
  return [...set];
})();
const cgEdges = [];
for(const s in CAUSAL){ (CAUSAL[s] || []).forEach(t => cgEdges.push({from:s, to:t, type:'verified'})); }
for(const s in CAUSAL_INFERRED){ (CAUSAL_INFERRED[s] || []).forEach(t => cgEdges.push({from:s, to:t, type:'inferred'})); }
const cgCoreNodes = new Set();
for(const e of cgEdges){ if(e.type === 'verified'){ cgCoreNodes.add(e.from); cgCoreNodes.add(e.to); } }
const cgInferredOnly = new Set();
for(const k of cgNodes){ if(!cgCoreNodes.has(k)) cgInferredOnly.add(k); }

// 因果脉络弹窗中可点击的「前因/后续」标签
function makeCausalChip(x, dir){
  const c = document.createElement('span');
  c.className = 'causal-chip' + (x.cat === 'kmt' ? ' kmt' : '');
  const arrow = dir === 'before' ? '↑前因 ' : '↓后续 ';

  c.onclick = () => openModal(x.month, x.day, eventsOfKey(keyOf(x)));

function scrollTimelineToKey(k){
  const sc = document.getElementById('tlScroll');
  const node = keyNode[k];
  if(sc && node) sc.scrollLeft = Math.max(0, node.offsetLeft - sc.clientWidth / 2);
}
function updateCausalStatus(){
  const el = document.getElementById('tlCausalStatus');
  if(!el) return;
  if(causalHighlightKey){
    const root = eventsOfKey(causalHighlightKey)[0];
    const n = causalClosure(causalHighlightKey).size;
    el.textContent = (root ? root.title : causalHighlightKey) + ' 的脉络（共 ' + n + ' 个相关事件）· 点击其他卡片可切换根';
  } else if(causalMode){
    el.textContent = '已开启：点击时间轴上的事件查看其因果脉络';
  } else {
    el.textContent = '';
  }
}
function toggleCausalMode(){

}

// 着色：事件越多颜色越深，但透明度上限保证文字可读
// cat 为 'kmt' 时用蓝色系（与中共无直接因果、主体属其他力量），其余用红色系（中共相关）
function tint(count, max, cat){
    if(count <= 0) return "transparent";
    const ratio = max > 0 ? count / max : 0;
    const alpha = 0.10 + ratio * 0.32; // 0.10 ~ 0.42
    const rgb = (cat === 'kmt') ? '26,82,118' : '178,34,34';
    return `rgba(${rgb},${alpha.toFixed(2)})`;
}

function renderMonthBar(){

    const allFiltered = getFilteredEvents();
    const monthCounts = {};
    allFiltered.forEach(e=> monthCounts[e.month] = (monthCounts[e.month]||0) + 1);
    const maxMonth = Math.max(1, ...Object.values(monthCounts));

    for(let m=1; m<=12; m++){
        const btn = document.createElement('button');

        btn.className = "month-btn" + (isActive ? " active" : "");

        btn.dataset.m = m;

        const c = monthCounts[m] || 0;
        if(!isActive){

            // 该月事件全部属其他力量(kmt)时染蓝，否则染红
            const monthKmt = allFiltered.some(e=>e.month===m && e.cat==='kmt') &&
                             !allFiltered.some(e=>e.month===m && e.cat!=='kmt');
            btn.style.background = (c > 0) ? tint(c, maxMonth, monthKmt ? 'kmt' : 'party') : "";

// ---------- 渲染日历（日期格按当日事件数着色） ----------
function renderCalendar(){
    const wrap = document.getElementById('calendarBody');
    wrap.innerHTML = "";
    const REF_YEAR = 2025; // 仅用于月历排版，与事件年份无关
    const daysInMonth = new Date(REF_YEAR, currentMonth, 0).getDate();
    const firstDayWeek = new Date(REF_YEAR, currentMonth-1, 1).getDay();
    const emptyStartCount = firstDayWeek === 0 ? 6 : firstDayWeek - 1;

    const allFiltered = getFilteredEvents();

    const dayCounts = {};
    allFiltered.forEach(e=>{ if(e.month === currentMonth) dayCounts[e.day] = (dayCounts[e.day]||0) + 1; });
    const maxDay = Math.max(1, ...Object.values(dayCounts));

    for(let i=0; i<emptyStartCount; i++){
        const div = document.createElement('div');
        div.className = "day-cell empty-day";
        wrap.appendChild(div);
    }

    for(let d=1; d<=daysInMonth; d++){
        const cell = document.createElement('div');
        cell.className = "day-cell";
        const events = allFiltered.filter(item=>item.month === currentMonth && item.day === d);
        const count = dayCounts[d] || 0;
        // 该日事件全部属其他力量(kmt)时染蓝，否则染红
        const dayKmt = count>0 && events.some(e=>e.cat==='kmt') &&
                       !events.some(e=>e.cat!=='kmt');
        cell.style.background = tint(count, maxDay, dayKmt ? 'kmt' : 'party');
        cell.innerHTML = `<div class="day-num">${d}日</div>`;

        events.slice(0,3).forEach(ev=>{
            const eDiv = document.createElement('div');
            eDiv.className = "event-item";
            eDiv.innerText = `${ev.year}年：${ev.title}`;
            // 单条事件按所属主题着色：其他力量(蓝色) / 中共(红色)
            eDiv.style.borderLeftColor = (ev.cat==='kmt') ? '#1a5276' : '#b22222';
            cell.appendChild(eDiv);
        })
        if(events.length>3){
            const tip = document.createElement('div');
            tip.style.fontSize="11px";
            tip.innerText = `...共${events.length}条，点击查看`;
            cell.appendChild(tip);
        }

        cell.onclick = function(){
            openModal(currentMonth, d, events);
        }
        wrap.appendChild(cell);
    }
}

        rel.appendChild(h);
        sameDay.slice(0,6).forEach(x=>{

    }
    const sameCat = historyData.filter(x=> x.cat===e.cat && x.title!==e.title)
        .sort((a,b)=> b.year-a.year).slice(0,8);
    if(sameCat.length){
        hasRel = true;
        const h = document.createElement('div'); h.className='ev-rel-h';
        h.textContent = '同类事件（' + (e.cat==='kmt'?'其他力量':'中共相关') + '）';
        rel.appendChild(h);
        sameCat.forEach(x=>{
            const c = document.createElement('span');
            c.className = 'rel-chip' + (x.cat==='kmt'?' kmt':'');
            c.textContent = `${x.year}年 ${x.title}`;
            c.title = x.desc;
            c.onclick = ()=> openModal(x.month, x.day, [x]);
            rel.appendChild(c);
        });
    }
    if(!hasRel){ const p=document.createElement('div'); p.className='rel-empty'; p.textContent='暂无关联事件'; rel.appendChild(p); }
    div.appendChild(rel);

    // 因果脉络（前因 / 后续，可点击跳转）
    const causalBox = document.createElement('div');

      const ch = document.createElement('div'); ch.className = 'ev-rel-h'; ch.textContent = '因果脉络';
      causalBox.appendChild(ch);

        causalBox.appendChild(sub);

      if(cAfter.length){
        const sub = document.createElement('div'); sub.className = 'causal-sub'; sub.textContent = '后续（本事件导致）';
        causalBox.appendChild(sub);
        cAfter.forEach(x => causalBox.appendChild(makeCausalChip(x, 'after')));

      const act = document.createElement('div'); act.className = 'causal-act';
      const ab = document.createElement('button'); ab.className = 'causal-link-btn'; ab.textContent = '查看因果网络图';

// ===================== 权威文献来源数据库（辅助逐条页码标注） =====================
// 用法（给某条事件补充精确出处）：
//   1) 最高优先级：在该事件对象上加 `src` 字段，如 src:"《简史》p.123"；
//   2) 或在本 sourceDB 中按 "年-月-日" 登记 { doc, page, note }，page 填印刷本页码
//      （在线版《一百年大事记》未分页，可用章节/时期定位，如 "上编·五四"）；
//   3) 未登记的事件由 periodOf(year) 自动归入党史分期，作为缺省出处，避免无来源署名。
const SOURCE_DOCS = {
    hundred:  { name:'《中国共产党一百年大事记》',          pub:'中共中央党史和文献研究院 / 人民网' },
    brief:    { name:'《中国共产党简史》',                  pub:'本书编写组，人民出版社·中共党史出版社 2021' },
    history:  { name:'《中国共产党历史》第一卷、第二卷',    pub:'中共中央党史研究室，中共党史出版社' },
    official: { name:'中华人民共和国中央人民政府网 / 人民网', pub:'www.gov.cn / www.people.com.cn' }
};
function periodOf(y){
    if(y < 1921) return { name:'建党前后（辛亥革命—中共一大）' };
    if(y < 1949) return { name:'新民主主义革命时期（1921—1949）' };
    if(y < 1978) return { name:'社会主义革命和建设时期（1949—1978）' };
    if(y < 2012) return { name:'改革开放和社会主义现代化建设新时期（1978—2012）' };
    return { name:'中国特色社会主义新时代（2012— ）' };
}
// 逐条来源登记：键为 "年-月-日"。page 填印刷本页码；在线版可写章节。留空("—")表示待标注。
// 示例（请按实际核对后补全页码）：
//   "1921-7-23": { doc:'hundred', page:'—', note:'中共一大在上海召开，后转嘉兴南湖' },
//   "1949-10-1": { doc:'hundred', page:'—', note:'开国大典' }
const sourceDB = {};
function resolveSource(e){
    const key = `${e.year}-${e.month}-${e.day}`;
    if(e.src) return '资料来源：' + e.src;
    const db = sourceDB[key];
    const per = periodOf(e.year);
    const docName = (db && SOURCE_DOCS[db.doc]) ? SOURCE_DOCS[db.doc].name : '《中国共产党一百年大事记》（人民网）';
    const page = (db && db.page && db.page !== '—') ? `· 第 ${db.page} 页` : '· 待标注页码';
    const note = (db && db.note) ? `（${db.note}）` : '';
    return `资料来源：${docName}（${per.name}）${page}${note}`;
}

let meetingFilter = 'all'; // 当前筛选类别
function openMeetings(){
    const mask = document.getElementById('modalMask');
    const title = document.getElementById('modalTitle');
    const content = document.getElementById('modalContent');
    title.textContent = '中共重要会议';
    content.innerHTML = '';
    // 类别筛选按钮
    const bar = document.createElement('div');
    bar.className = 'mtg-filter';
    const types = [
        ['all','全部'],
        ['congress','党代会（全国代表大会·几大）'],
        ['plenum','中央全会（几中全会）'],
        ['other','其他重要会议']
    ];
    types.forEach(([k,label])=>{
        const b = document.createElement('button');
        b.className = 'mtg-fbtn' + (k === meetingFilter ? ' active' : '');
        b.textContent = label;
        b.dataset.k = k;
        b.onclick = ()=>{ meetingFilter = k; updateMtgFilterBar(); renderMeetingList(); };
        bar.appendChild(b);
    });
    content.appendChild(bar);
    const list = document.createElement('div');
    list.id = 'mtgList';
    list.className = 'mtg-list';
    content.appendChild(list);
    renderMeetingList();
    mask.style.display = 'flex';
}
function updateMtgFilterBar(){
    document.querySelectorAll('.mtg-fbtn').forEach(b=>{
        b.classList.toggle('active', b.dataset.k === meetingFilter);
    });
}
function renderMeetingList(){
    const list = document.getElementById('mtgList');
    if(!list) return;
    list.innerHTML = '';
    const arr = meetingsData
        .filter(m => meetingFilter === 'all' || m.type === meetingFilter)
        .sort((a,b)=> a.year-b.year || a.month-b.month || a.day-b.day);
    if(arr.length === 0){ list.innerHTML = '<p style="color:#888">暂无该类别会议</p>'; return; }
    arr.forEach(m=>{
        const card = document.createElement('div');
        card.className = 'mtg-card mtg-' + m.type;
        const h = document.createElement('div');
        h.className = 'mtg-card-h';
        h.textContent = `${m.year}年${m.month}月${m.day}日 · ${m.title}`;
        const d = document.createElement('div');
        d.className = 'mtg-card-d';
        d.textContent = m.desc;
        const more = document.createElement('div');
        more.className = 'mtg-card-more';
        more.textContent = '点击查看详细内容 ›';
        card.appendChild(h); card.appendChild(d); card.appendChild(more);
        card.onclick = ()=> openMeetingDetail(m);
        list.appendChild(card);
    });
}

// ---------- 某条重要会议的详细内容弹窗 ----------
function openMeetingDetail(m){
    const mask = document.getElementById('modalMask');
    const title = document.getElementById('modalTitle');
    const content = document.getElementById('modalContent');
    title.textContent = m.title + ' · 会议详情';
    content.innerHTML = '';
    // 返回会议列表
    const back = document.createElement('button');
    back.className = 'mtg-detail-back';
    back.textContent = '← 返回会议列表';
    back.onclick = ()=> openMeetings();
    content.appendChild(back);
    // 类型标签
    const typeLabel = {
        congress: '党代会（全国代表大会·几大）',
        plenum: '中央全会（几中全会）',
        other: '其他重要会议'
    }[m.type] || '重要会议';
    const tp = document.createElement('span');
    tp.className = 'mtg-detail-type ' + m.type;
    tp.textContent = typeLabel;
    content.appendChild(tp);
    // 收藏星标

// 分类 + 年份范围 过滤（贯穿 日历 / 时间轴 / 右栏 / 搜索 / 导出 / 统计）
function softFilter(list){
    return list.filter(e=>{
        if(catFilter === 'party'    && e.cat === 'kmt') return false;
        if(catFilter === 'kmt'      && e.cat !== 'kmt') return false;
        if(catFilter === 'soft'     && !e.soft) return false;
        if(catFilter === 'political' && e.soft) return false;
        if(yearFrom != null && e.year < yearFrom) return false;
        if(yearTo != null && e.year > yearTo) return false;
        return true;
    });
}

// 年份是否在筛选范围内（用于年份下拉、统计等）
function inYearRange(y){
    if(yearFrom != null && y < yearFrom) return false;
    if(yearTo != null && y > yearTo) return false;
    return true;
}

function loadFavs(){

    catch(e){ return []; }
}
function saveFavs(){ try { localStorage.setItem('dangshi_favs', JSON.stringify(favs)); } catch(e){} }
function favKey(e){ return `${e.year}-${e.month}-${e.day}-${e.title}`; }
function isFav(e){ return favs.includes(favKey(e)); }
function toggleFav(e, starEl){
    const k = favKey(e);
    const i = favs.indexOf(k);
    if(i >= 0){ favs.splice(i,1); if(starEl) starEl.classList.remove('on'); }
    else { favs.push(k); if(starEl) starEl.classList.add('on'); }

}

document.addEventListener('keydown', function(e){
    const mask = document.getElementById('modalMask');
    const modalOpen = (mask && mask.style.display === 'flex');
    const typing = (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA'));
    if(e.key === "Escape"){ closeModal(); return; }
    // 弹窗内：↑↓←→ 切换多条事件
    if(modalOpen && currentModalEvents.length > 1 && !typing){
        if(e.key === "ArrowDown" || e.key === "ArrowRight"){
            e.preventDefault();
            currentModalIndex = (currentModalIndex + 1) % currentModalEvents.length;
            renderModalBody();
        }else if(e.key === "ArrowUp" || e.key === "ArrowLeft"){
            e.preventDefault();
            currentModalIndex = (currentModalIndex - 1 + currentModalEvents.length) % currentModalEvents.length;
            renderModalBody();
        }
        return;
    }
    // 无弹窗时：← → 切换年份
    if(!modalOpen && !typing){
        if(e.key === "ArrowLeft"){ setYearIndex(yearIndex - 1); }
        else if(e.key === "ArrowRight"){ setYearIndex(yearIndex + 1); }
    }
});

// 横向拖动 + 滚轮 + 触摸
(function initTimelineDrag(){
    const sc = document.getElementById('tlScroll');
    let isDown=false, startX=0, startScroll=0, moved=false;
    sc.addEventListener('mousedown', (e)=>{
        isDown=true; moved=false;
        startX = e.pageX; startScroll = sc.scrollLeft;
        sc.classList.add('dragging');
    });
    window.addEventListener('mouseup', ()=>{
        isDown=false; sc.classList.remove('dragging');
    });
    sc.addEventListener('mousemove', (e)=>{
        if(!isDown) return;
        const dx = e.pageX - startX;
        if(Math.abs(dx) > 4) moved = true;
        sc.scrollLeft = startScroll - dx;
    });
    // 拖动结束后抑制误触卡片点击
    sc.addEventListener('click', (e)=>{
        if(moved){ e.stopPropagation(); e.preventDefault(); }
    }, true);
    sc.addEventListener('touchend', ()=>{ moved = false; });
    // 鼠标滚轮纵向 -> 横向滚动
    sc.addEventListener('wheel', (e)=>{
        if(e.deltaY !== 0 && !e.shiftKey){
            sc.scrollLeft += e.deltaY;
            e.preventDefault();
        }
    }, {passive:false});
})();

    '改革','开放','会议','起义','抗战','长征','建国','宪法','经济','科技','外交','港澳','统一','思想',

function showTagEvents(term){
    const title = document.getElementById('modalTitle');
    const content = document.getElementById('modalContent');
    const list = historyData.filter(e=> e.title.includes(term) || (e.desc && e.desc.includes(term)))
        .sort((a,b)=> a.year-b.year || a.month-b.month || a.day-b.day);
    title.textContent = `标签「${term}」· 共 ${list.length} 个相关事件`;
    content.innerHTML = '';
    const back = document.createElement('button');
    back.className = 'cg-btn'; back.style.cssText = 'margin-bottom:12px;';
    back.textContent = '← 返回标签云';
    back.onclick = openTagCloud;
    content.appendChild(back);
    if(list.length === 0){
        const p = document.createElement('p'); p.style.cssText = 'color:#999;';
        p.textContent = '暂无相关事件。';
        content.appendChild(p);
        document.getElementById('modalMask').style.display = 'flex';
        return;
    }
    const wrap = document.createElement('div');
    wrap.style.cssText = 'display:flex;flex-direction:column;gap:8px;max-height:62vh;overflow:auto;';
    list.forEach(e=>{
        const row = document.createElement('div');
        row.className = 'modal-event' + (e.cat==='kmt' ? ' kmt' : '');
        row.style.cssText = 'cursor:pointer;';
        row.innerHTML = `<strong>${e.year}年</strong> · ${e.month}月${e.day}日 ${e.title}`;
        row.title = e.desc;
        row.onclick = ()=> openModal(e.month, e.day, [e], () => showTagEvents(term));
        wrap.appendChild(row);
    });
    content.appendChild(wrap);
    document.getElementById('modalMask').style.display = 'flex';
}
function openTagCloud(){
    const title = document.getElementById('modalTitle');
    const content = document.getElementById('modalContent');
    title.textContent = "标签云 · 点击查看相关事件";
    content.innerHTML = "";
    const note = document.createElement('p');
    note.style.cssText = "color:#888;font-size:13px;margin-bottom:12px;";
    note.textContent = "点击下方标签，直接查看与它相关的全部事件：";
    content.appendChild(note);
    const base = historyData.slice();
    const cloud = document.createElement('div');
    cloud.className = 'tag-cloud';
    TAG_TERMS.forEach(term=>{
        const cnt = base.filter(e=> e.title.includes(term) || (e.desc && e.desc.includes(term))).length;
        if(cnt === 0) return;
        const tag = document.createElement('span');
        tag.className = 'tag' + (cnt >= 12 ? ' hot' : cnt >= 6 ? ' hot2' : '') + (term==='港澳'||term==='统一'||term==='外交'||term==='一国两制' ? ' kmt' : '');
        tag.textContent = `${term} (${cnt})`;
        tag.onclick = ()=> showTagEvents(term);
        cloud.appendChild(tag);
    });
    content.appendChild(cloud);
    document.getElementById('modalMask').style.display = "flex";
}

// ---------- 导出增强 ----------
function downloadText(filename, text){
    const blob = new Blob([text], {type:"text/plain;charset=utf-8"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    a.click();
    URL.revokeObjectURL(url);
}
function buildExportRows(){
    // 当前筛选下的全量事件（含分类与年份范围）
    return softFilter(historyData.slice())
        .sort((a,b)=> a.year-b.year || a.month-b.month || a.day-b.day);
}
function openExport(){
    const title = document.getElementById('modalTitle');
    const content = document.getElementById('modalContent');
    title.textContent = "导出事件清单";
    content.innerHTML = "";
    const rangeTxt = (yearFrom!=null || yearTo!=null) ? `（年份范围：${yearFrom||'起'}–${yearTo||'今'}）` : '';
    const catTxt = {all:'全部',party:'中共相关',kmt:'其他力量',soft:'科技·文教',political:'重大政治'}[catFilter] || '全部';
    const note = document.createElement('p');
    note.style.cssText = "color:#888;font-size:13px;margin-bottom:12px;";
    note.textContent = `当前筛选：${catTxt} ${rangeTxt} · 搜索「${searchKey||'无'}」`;
    content.appendChild(note);

    const opts = [
        {ico:'📄', t:'当月清单（TXT）', d:`${filterYear}年${currentMonth}月 的事件，纯文本`, fn: exportMonthTxt},
        {ico:'📚', t:'全年清单（TXT）', d:`${filterYear}年 全部事件，纯文本`, fn: exportYearTxt},
        {ico:'📊', t:'当前筛选（CSV）', d:'跨年份，含 年/月/日/分类/标题/描述，可进 Excel', fn: exportCsv},
        {ico:'📝', t:'当前筛选（Markdown）', d:'跨年份，按年份分组的 Markdown 文档', fn: exportMarkdown},
    ];
    const menu = document.createElement('div');
    menu.className = 'export-menu';
    opts.forEach(o=>{
        const el = document.createElement('div');
        el.className = 'export-opt';
        el.innerHTML = `<div class="ico">${o.ico}</div><div><div class="t">${o.t}</div><div class="d">${o.d}</div></div>`;
        el.onclick = ()=>{ o.fn(); };
        menu.appendChild(el);
    });
    content.appendChild(menu);
    document.getElementById('modalMask').style.display = "flex";
}
function exportMonthTxt(){
    const rows = buildExportRows().filter(e=> e.year===filterYear && e.month===currentMonth);
    let text = `【${filterYear}年${currentMonth}月 党史事件清单】\n\n`;
    rows.forEach(e=>{ text += `${e.month}月${e.day}日 ${e.year}年：${e.title}\n    ${e.desc}\n`; });
    if(rows.length === 0) text += "（本月暂无符合条件的事件）\n";
    downloadText(`${filterYear}年${currentMonth}月党史事件.txt`, text);
}
function exportYearTxt(){
    const rows = buildExportRows().filter(e=> e.year===filterYear);
    let text = `【${filterYear}年 党史事件清单】\n\n`;
    rows.forEach(e=>{ text += `${e.month}月${e.day}日 ${e.year}年：${e.title}\n    ${e.desc}\n`; });
    if(rows.length === 0) text += "（本年暂无符合条件的事件）\n";
    downloadText(`${filterYear}年党史事件.txt`, text);
}
function exportCsv(){
    let text = "年份,月份,日期,分类,标题,描述\n";
    buildExportRows().forEach(e=>{
        const cat = e.cat==='kmt' ? '其他力量' : (e.soft ? '科技·文教' : '中共相关');
        const esc = s => '"' + String(s).replace(/"/g,'""') + '"';
        text += `${e.year},${e.month},${e.day},${cat},${esc(e.title)},${esc(e.desc)}\n`;
    });
    downloadText('党史事件清单.csv', text);
}
function exportMarkdown(){
    let text = `# 星火日历 · 事件清单\n\n`;
    text += `> 筛选：${({all:'全部',party:'中共相关',kmt:'其他力量',soft:'科技·文教',political:'重大政治'}[catFilter]||'全部')} · 年份范围：${yearFrom||'起'}–${yearTo||'今'}\n\n`;
    const rows = buildExportRows();
    let curYear = null;
    rows.forEach(e=>{
        if(e.year !== curYear){ curYear = e.year; text += `\n## ${e.year}年\n`; }
        text += `- **${e.month}月${e.day}日**：${e.title} — ${e.desc}\n`;
    });
    if(rows.length === 0) text += "\n（暂无符合条件的事件）\n";
    downloadText('党史事件清单.md', text);
}

document.getElementById('tlCausalBtn').onclick = openCausal;
// 本年事件速览：右上角按钮展开/收起
document.getElementById('railToggle').onclick = toggleRail;
// 因果网络图：滚轮缩放与拖拽平移（鼠标中心缩放 + 拖拽阈值 + 平移边界 + 节点微调 + 触摸支持）
(function(){
  const canvas = document.getElementById('cgCanvas');
  if(!canvas) return;
  const LW = 2200, LH = 1500;   // 画布逻辑尺寸（与 build_causal_layout 一致）
  const TH = 4;                 // 拖拽阈值 px（区分 click 与 drag）

  function rect(){ return canvas.getBoundingClientRect(); }
  // SVG 设了 viewBox 0 0 2200 1500，且被等比缩放居中填满画布，故屏幕像素↔viewBox 单位需换算
  function vbInfo(){
    const r = rect();
    const vs = Math.min(r.width / 2200, r.height / 1500);
    const ox = (r.width - 2200 * vs) / 2, oy = (r.height - 1500 * vs) / 2;
    return { r, vs, ox, oy };
  }
  function toVB(clientX, clientY){
    const { r, vs, ox, oy } = vbInfo();
    return { x: (clientX - r.left - ox) / vs, y: (clientY - r.top - oy) / vs };
  }
  // 约束平移：全程使用 viewBox 单位（与 viewBox 窗口 2200×1500 一致），不再混用屏幕像素
  function clampPan(){
    const winW = 2200, winH = 1500;
    const iw = LW * cgScale, ih = LH * cgScale;
    if(iw <= winW){ cgTx = (winW - iw) / 2; }                 // 内容小于窗口：居中
    else { const keep = Math.min(winW * 0.35, iw * 0.35);      // 内容大于窗口：至少保留 35% 可见
           cgTx = Math.max(keep - iw, Math.min(winW - keep, cgTx)); }
    if(ih <= winH){ cgTy = (winH - ih) / 2; }
    else { const keep = Math.min(winH * 0.35, ih * 0.35);
           cgTy = Math.max(keep - ih, Math.min(winH - keep, cgTy)); }
  }
  window.cgClampPan = clampPan;

  // 滚轮缩放：以鼠标位置为中心
  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    const v = toVB(e.clientX, e.clientY);                       // 屏幕像素→viewBox 单位（指针下的点）
    const factor = e.deltaY < 0 ? 1.1 : 0.9;
    const ns = Math.max(0.4, Math.min(2.5, cgScale * factor));
    const bx = (v.x - cgTx) / cgScale, by = (v.y - cgTy) / cgScale;  // 指针下的布局点
    cgScale = ns;
    cgTx = v.x - bx * ns; cgTy = v.y - by * ns;                 // 保持该布局点不动（以指针为中心）
    clampPan(); applyCgTransform();
  }, {passive:false});

  // 鼠标平移（含阈值）；节点拖动由 window._cgNodeDrag 接管
  let down = false, moved = false, sx = 0, sy = 0;
  canvas.addEventListener('mousedown', (ev) => {
    ev.preventDefault();
    down = true; moved = false; sx = ev.clientX; sy = ev.clientY;
  });
  window.addEventListener('mousemove', (ev) => {
    // 节点拖动微调优先
    if(window._cgNodeDrag){
      const nd = window._cgNodeDrag;
      if(!nd.active){
        if(Math.hypot(ev.clientX - nd.startMx, ev.clientY - nd.startMy) < TH) return;
        nd.active = true;
      }
      const { vs } = vbInfo();
      const dx = (ev.clientX - nd.startMx) / (cgScale * vs);   // 屏幕位移 → viewBox 逻辑位移（含 viewBox 缩放）
      const dy = (ev.clientY - nd.startMy) / (cgScale * vs);
      const nx = nd.origX + dx, ny = nd.origY + dy;
      const pos = cgPos(nd.key);
      pos.x = nx; pos.y = ny;
      const g = document.querySelector('.cg-node[data-key="' + nd.key + '"]');
      if(g) g.setAttribute('transform', 'translate(' + nx + ',' + ny + ')');
      // 同步所有相关边
      document.querySelectorAll('.cg-edge[data-from="' + nd.key + '"],.cg-edge[data-to="' + nd.key + '"]').forEach(p => {
        const a = cgPos(p.getAttribute('data-from')), b = cgPos(p.getAttribute('data-to'));
        if(a && b) p.setAttribute('d', cgEdgePath(a, b));
      });
      window._cgNodeMoved = true;
      return;
    }
    if(!down) return;
    const dx = ev.clientX - sx, dy = ev.clientY - sy;
    if(!moved){ if(Math.hypot(dx, dy) < TH) return; moved = true; canvas.classList.add('dragging'); }
    const { vs } = vbInfo();
    cgTx += dx / vs; cgTy += dy / vs; sx = ev.clientX; sy = ev.clientY;
    clampPan(); applyCgTransform();
  });
  window.addEventListener('mouseup', () => {
    down = false; canvas.classList.remove('dragging');
    if(window._cgNodeDrag && !window._cgNodeDrag.active) window._cgNodeMoved = false;  // 未真正拖动，放行 click
    window._cgNodeDrag = null;
  });

  // 触摸支持：单指拖拽 + 双指 pinch 缩放
  let tDown = false, tMoved = false, tsx = 0, tsy = 0, pinchDist = 0, pinchCx = 0, pinchCy = 0, pinchScale = 1;
  canvas.addEventListener('touchstart', (e) => {
    if(e.touches.length === 1){
      tDown = true; tMoved = false; tsx = e.touches[0].clientX; tsy = e.touches[0].clientY;
    } else if(e.touches.length === 2){
      tDown = false;
      const dx = e.touches[0].clientX - e.touches[1].clientX, dy = e.touches[0].clientY - e.touches[1].clientY;
      pinchDist = Math.hypot(dx, dy) || 1;
      pinchCx = (e.touches[0].clientX + e.touches[1].clientX) / 2;
      pinchCy = (e.touches[0].clientY + e.touches[1].clientY) / 2;
      pinchScale = cgScale;
    }
  }, {passive:true});
  canvas.addEventListener('touchmove', (e) => {
    if(e.touches.length === 1 && tDown){
      e.preventDefault();
      const dx = e.touches[0].clientX - tsx, dy = e.touches[0].clientY - tsy;
      if(!tMoved){ if(Math.hypot(dx, dy) < TH) return; tMoved = true; }
      const { vs } = vbInfo();
      cgTx += dx / vs; cgTy += dy / vs; tsx = e.touches[0].clientX; tsy = e.touches[0].clientY;
      clampPan(); applyCgTransform();
    } else if(e.touches.length === 2){
      e.preventDefault();
      const dx = e.touches[0].clientX - e.touches[1].clientX, dy = e.touches[0].clientY - e.touches[1].clientY;
      const d = Math.hypot(dx, dy) || 1;
      const ns = Math.max(0.4, Math.min(2.5, pinchScale * (d / pinchDist)));
      const v = toVB(pinchCx, pinchCy);                         // 双指中点：屏幕像素→viewBox 单位
      const bx = (v.x - cgTx) / cgScale, by = (v.y - cgTy) / cgScale;
      cgScale = ns; cgTx = v.x - bx * ns; cgTy = v.y - by * ns;
      clampPan(); applyCgTransform();
    }
  }, {passive:false});
  canvas.addEventListener('touchend', () => { tDown = false; }, {passive:true});

  const closeBtn = document.getElementById('cgClose');
  if(closeBtn) closeBtn.onclick = closeCausalGraph;
  const resetBtn = document.getElementById('cgReset');
  if(resetBtn) resetBtn.onclick = () => {
    if(cgFocusMode && cgRoot) cgFitToRoot(causalLayerX(cgRoot, cgDepth));   // 聚焦模式：重置即重新居中
    else { cgScale = 1; cgTx = 0; cgTy = 0; clampPan(); applyCgTransform(); }
  };
  const focusBtn = document.getElementById('cgFocus');
  if(focusBtn) focusBtn.onclick = () => {
    cgFocusMode = !cgFocusMode;
    if(cgRoot) setCausalRoot(cgRoot); else applyCgFocus();
  };
  const inferBtn = document.getElementById('cgInfer');
  if(inferBtn) inferBtn.onclick = toggleCgInfer;
  const expandBtn = document.getElementById('cgExpand');
  if(expandBtn) expandBtn.onclick = () => { cgDepth++; setCausalRoot(cgRoot); };
  const shrinkBtn = document.getElementById('cgShrink');
  if(shrinkBtn) shrinkBtn.onclick = () => { if(cgDepth > 1){ cgDepth--; setCausalRoot(cgRoot); } };
  const sideBtn = document.getElementById('cgSideBtn');
  if(sideBtn) sideBtn.onclick = () => {
    if(!cgFocusMode) return;   // 全部视图不展示列表，仅脉络（聚焦）视图可开关
    const p = document.getElementById('cgPanel');
    if(p){ p.classList.toggle('cg-hide-side'); updateCgSideTab(); }
  };
  const sideClose = document.getElementById('cgSideClose');
  if(sideClose) sideClose.onclick = () => { const p = document.getElementById('cgPanel'); if(p){ p.classList.add('cg-hide-side'); updateCgSideTab(); } };
  const sideTab = document.getElementById('cgSideTab');
  if(sideTab) sideTab.onclick = () => { const p = document.getElementById('cgPanel'); if(p){ p.classList.remove('cg-hide-side'); updateCgSideTab(); } };
  const sideFilterBox = document.getElementById('cgSideFilter');
  if(sideFilterBox){
    sideFilterBox.querySelectorAll('.cg-fbtn').forEach(btn => {
      btn.onclick = () => {
        cgSideFilter = btn.getAttribute('data-f');
        sideFilterBox.querySelectorAll('.cg-fbtn').forEach(b => b.classList.toggle('active', b === btn));
        renderCgSide();
      };
    });
  }
  const lineageSel = document.getElementById('cgLineage');
  if(lineageSel) lineageSel.onchange = () => {
    const v = lineageSel.value;
    if(!v) return;
    openCausalGraph(v, true);
  };
})();
