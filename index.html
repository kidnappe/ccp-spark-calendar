/* ===================== 移动端适配（显示优化 + 操控优化） ===================== */
/* 平板及以下：整体收边、工具加大点按区、日历与弹窗防溢出 */
@media (max-width: 768px){
  body { padding: 10px; }
  h1 { font-size: 21px; margin-bottom: 8px; }
  /* 工具栏：搜索框独占整行，按钮换行并放大点按区域 */
  .toolbar-row { gap: 8px; }
  /* 搜索框缩短：手机模式三按钮竖排在右上角，给按钮腾出右侧空间，避免重叠 */
  .search-box { flex: 1 1 100%; min-width: 0; order: -1; margin-right: 52px; max-width: calc(100% - 52px); }
  .toolbar button { padding: 12px 14px; font-size: 13px; }
  .mode-btn { padding: 12px 18px; }   /* 移动端触控目标 ≥40px */
  .cal-masthead .year-nav { width: 38px; height: 38px; }
  .cal-masthead .year-label { padding: 4px 6px; min-width: 84px; }
  /* 移动端：详情页事件标题加粗增大、朱砂红 */
  .modal-event-title { font-size: 18px; font-weight: 800; color: var(--vermilion-deep); }
  /* 移动端：工具栏吸顶时留出 top 空隙 */
  .toolbar { padding-top: 6px; }
  /* 日历：日格更紧凑、字号收敛，保证 7 列不溢出；事件文字换行纵向拓展而非压扁 */
  .calendar-box { padding: 10px; }
  .week-title div { padding: 6px 2px; font-size: 12px; }
  .date-grid { gap: 4px; grid-auto-rows: minmax(0, auto); }
  .day-cell { min-height: 96px; padding: 5px; }
  .day-num { font-size: 15px; margin-bottom: 4px; }
  /* 移动端：事件名完整换行显示（不截断），格子随内容增高，同行对齐保持美观 */
  .event-item { font-size: 11px; padding-left: 5px; white-space: normal; overflow: visible; line-height: 1.35; margin-bottom: 3px; }
  /* 弹窗：限制高度，长内容内部滚动，避免溢出视口；宽度收敛到手机比例，内容禁止横向溢出 */
  .modal-box { max-height: min(92vh, calc(var(--vvh, 100vh) - 16px)); padding: 16px; width: min(92vw, 480px); }
  #modalContent { overflow-x: hidden; max-width: 100%; padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px)); }
  /* 因果网络图：头部工具换行、按钮加大便于触控 */
  .cg-title { font-size: 14px; }
  .cg-btn, .cg-select { font-size: 13px; padding: 12px 13px; }
  .cg-tools { flex-wrap: wrap; }
  .cg-fbtn { padding: 11px 0; font-size: 13px; }
  .cg-side-tab { padding: 18px 7px; font-size: 14px; }
  .cg-side-close { width: 40px; height: 40px; font-size: 26px; }
  /* 提升触控响应：去除双击缩放延迟，标记可点元素 */
  .toolbar button, .mode-btn, .month-btn, .cg-btn, .cg-fbtn, .cg-select,
  .close-modal, .about-tab, .rail-toggle, .year-nav, .year-label, .day-cell, .tl-card,
  .tl-btn, .cal-today, .tl-select, .menu-fab, .menu-drawer-close, .rail-close, .modal-x {
    touch-action: manipulation;
  }
  .close-modal { padding: 11px 20px; font-size: 15px; }
  /* 弹窗 / 抽屉关闭钮触控目标 ≥40px */
  .modal-x { width: 40px; height: 40px; font-size: 24px; }
  .menu-drawer-close { width: 40px; height: 40px; font-size: 22px; }
  .rail-close { padding: 6px 8px; margin: -6px 0 0 2px; }   /* 扩大命中区，视觉不变 */
  /* 时间轴工具栏：窄屏换行排布，hint 下沉末行，避免 7 控件横向溢出 */
  .tl-toolbar { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 6px 10px; padding: 10px 8px; }
  .tl-toolbar .tl-hint { flex: 1 1 100%; order: 10; text-align: center; }
  .tl-toolbar .tl-select { max-width: 190px; margin-left: 0; }
}
/* 手机：进一步收敛间距与字号，保证最小屏可用 */
@media (max-width: 480px){
  body { padding: 8px; }
  h1 { font-size: 19px; }
  .toolbar button { font-size: 12px; padding: 9px 10px; }
  .day-cell { min-height: 84px; }
  .event-item { font-size: 10.5px; }
  .cg-btn, .cg-select { padding: 10px 10px; font-size: 12px; }
  .cg-side-head { font-size: 12px; padding: 7px 10px; }
  .menu-fab { top: calc(10px + env(safe-area-inset-top, 0px)); right: 10px; left: auto; width: 40px; height: 40px; font-size: 18px; }
  .tl-toolbar { gap: 5px 8px; padding: 8px 6px; }
  .tl-toolbar .tl-select { max-width: 170px; }
  .tl-toolbar .year-label { padding: 4px 3px; min-width: 60px; }
}
/* 打印 / 导出 PDF（F3）：仅保留内容区，隐藏工具栏等，保留底色 */
@media print {
  html, body { background: #fff !important; padding: 0 !important; }
  * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
  .toolbar, .mode-switch, .cal-masthead, .theme-fab, .brand-fab, .menu-fab, .month-sidebar, .tl-toolbar, .hint, .tl-select,
  #tlThreadClear, .rail-right, .rail-toggle, .cg-overlay, #modalMask,
  .menu-drawer, .menu-drawer-mask, .rail-right, .cg-side-detail { display: none !important; }
  .container { box-shadow: none !important; border: none !important; margin: 0 !important; max-width: none !important; }
  .date-grid { break-inside: avoid; }
}

/* =========================================================================
   报刊按钮体系 · 微交互（落地）
   五类：① 印章主钮(实心朱砂) ② 铅字次钮(纸底细边) ③ 报刊幽灵钮(透描边)
        ④ 报头文字钮(下划线自左画出) ⑤ 圆钮(图标圆钮·缩放反馈)
   统一：悬浮上抬2px + 朱砂渐显，按下收缩，键盘朱砂环；指数缓出、不回弹；
        只动 transform/opacity/色彩；尊重 prefers-reduced-motion。
   ========================================================================= */

/* ① 模式切换：朱砂滑块（印章在两段间滑行） */
.mode-switch { position: relative; }
.mode-btn { position: relative; z-index: 1; }
.mode-pill {
    position: absolute;
    left: 0; top: 0;
    width: 0; height: 0;
    background: var(--vermilion-deep);
    border-radius: 5px;
    box-shadow: 0 3px 12px rgba(139,26,26,0.35);
    transform: translateX(0);
    transition: transform var(--dur-mid) var(--ease-quint),
                width var(--dur-mid) var(--ease-quint),
                height var(--dur-mid) var(--ease-quint),
                top var(--dur-mid) var(--ease-quint);
    z-index: 0;
    pointer-events: none;
}

/* 统一过渡（覆盖各钮原有 transition，纳入 transform/box-shadow） */
.toolbar button, .mode-btn, .ref-btn, .tl-btn, .cg-btn, .cg-fbtn,
.cat-select, .month-btn, .menu-item, .ghost-btn,
.year-option, .close-modal, .menu-drawer-close, .rail-close, .modal-x {
    transition:
        transform var(--dur-fast) var(--ease-quint),
        background-color var(--dur-fast) var(--ease-quint),
        color var(--dur-fast) var(--ease-quint),
        border-color var(--dur-fast) var(--ease-quint),
        box-shadow var(--dur-fast) var(--ease-quint);
}

/* ② 铅字次钮 / ③ 幽灵钮 / 选中态：悬浮上抬 + 暖投影（文字钮与圆钮除外）。
   仅限鼠标精确指针——触屏上 hover 会粘滞，包进 (hover:hover) 后点按不残留"抬起"姿态 */
@media (hover: hover) and (pointer: fine) {
.toolbar button:hover,
.mode-btn:hover, .ref-btn:hover, .tl-btn:hover, .cg-btn:hover, .cg-fbtn:hover,
.cat-select:hover, .month-btn:hover, .menu-item:hover,
.ghost-btn:hover, .year-option:hover, .close-modal:hover,
.menu-drawer-close:hover, .rail-close:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(90,70,40,0.20);
}
}

/* 按下：轻微回缩（无回弹） */
.toolbar button:active,
.mode-btn:active, .ref-btn:active, .tl-btn:active, .cg-btn:active, .cg-fbtn:active,
.cat-select:active, .month-btn:active, .menu-item:active,
.ghost-btn:active, .year-option:active, .close-modal:active,
.menu-drawer-close:active, .rail-close:active, .modal-x:active {
    transform: translateY(0) scale(.96);
}

/* ③ 报刊幽灵钮：透底 + 朱砂描边 + 朱砂字（原 ghost-btn 改为真·幽灵） */
.ghost-btn {
    background: transparent;
    color: var(--vermilion-deep);
    border: 1px solid var(--edge);
}
.ghost-btn:hover { background: var(--paper-hover); color: var(--vermilion); }
[data-theme="dark"] .ghost-btn { background: transparent; color: var(--vermilion-soft); border-color: var(--dark-edge); }
[data-theme="dark"] .ghost-btn:hover { background: #2e2a22; color: var(--vermilion-soft); }

/* ④ 报头文字钮：下划线自左画出（不位移） + 悬浮变朱砂（下划线动效仅鼠标指针；触屏用 :active 反馈代替） */
.cal-masthead .year-nav, .cal-masthead .year-label, .cal-today { position: relative; }
.cal-masthead .year-nav::after,
.cal-masthead .year-label::after,
.cal-today::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: 0;
    height: 2px; background: var(--vermilion);
    transform: scaleX(0); transform-origin: left center;
    transition: transform var(--dur-mid) var(--ease-quint);
    pointer-events: none;
}
@media (hover: hover) and (pointer: fine) {
.cal-masthead .year-nav:hover::after,
.cal-masthead .year-label:hover::after,
.cal-today:hover::after { transform: scaleX(1); }
}
/* 圆钮（年份箭头）按下收缩，独立于上抬规则 */
.cal-masthead .year-nav:active { transform: scale(.92); }

/* ⑤ 圆钮：图标圆钮缩放反馈（悬浮放大仅鼠标指针，按下收缩触屏可用） */
.theme-fab, .menu-fab, .rail-toggle, .modal-x, .menu-drawer-close, .rail-close {
    transition:
        transform var(--dur-fast) var(--ease-quint),
        background-color var(--dur-fast) var(--ease-quint),
        color var(--dur-fast) var(--ease-quint),
        box-shadow var(--dur-fast) var(--ease-quint);
}
@media (hover: hover) and (pointer: fine) {
.theme-fab:hover, .menu-fab:hover, .modal-x:hover,
.menu-drawer-close:hover, .rail-close:hover {
    transform: scale(1.06);
    box-shadow: 0 4px 12px rgba(90,70,40,0.22);
}
}
.theme-fab:active, .menu-fab:active, .modal-x:active,
.menu-drawer-close:active, .rail-close:active {
    transform: scale(.92);
}

/* ⑥ 焦点可见性：朱砂环（键盘可达性，不破坏鼠标体验） */
.toolbar button:focus-visible, .mode-btn:focus-visible, .ref-btn:focus-visible,
.tl-btn:focus-visible, .cg-btn:focus-visible, .cg-fbtn:focus-visible,
.cat-select:focus-visible, .month-btn:focus-visible, .menu-item:focus-visible,
.rail-toggle:focus-visible, .ghost-btn:focus-visible, .year-option:focus-visible,
.close-modal:focus-visible, .menu-drawer-close:focus-visible, .rail-close:focus-visible,
.modal-x:focus-visible, .year-nav:focus-visible, .year-label:focus-visible,
.cal-today:focus-visible, .theme-fab:focus-visible, .menu-fab:focus-visible {
    outline: none;
    box-shadow: 0 0 0 3px rgba(178,34,34,0.42);
}

/* 尊重减少动态偏好：关闭所有位移/缩放过渡（功能态仍即时切换） */
@media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
        animation-delay: 0ms !important;
    }
}
</style>

<script>
/* 诊断控制台：静默收集运行时错误，连点三次左上品牌图标弹出窗口查看 */
(function(){
    var logs=[], panel=null;
    function render(){
        try{
            if(!panel) return;
            var pre=panel.querySelector('pre');
            pre.textContent = logs.length ? logs.join('\n') : '暂无捕获的运行时错误。';
            pre.scrollTop = pre.scrollHeight;
        }catch(_){}
    }
    function record(m){
        var t=new Date().toTimeString().slice(0,8);
        logs.push('['+t+'] '+m);
        if(logs.length>200) logs.shift();
        render();
    }
    window.addEventListener('error', function(e){
        record('[错误] '+((e && e.message)||'未知')+' @'+((e && e.lineno)||'?'));
    });
    window.addEventListener('unhandledrejection', function(e){
        record('[Promise] '+((e.reason && e.reason.message)||e.reason||'未处理的拒绝'));
    });
    function build(){
        panel=document.createElement('div');
        panel.style.cssText='position:fixed;left:12px;bottom:12px;z-index:99998;'
            +'width:min(92vw,560px);max-height:52vh;'
            +'background:#0f172a;color:#cbd5e1;border-radius:10px;'
            +'box-shadow:0 10px 30px rgba(0,0,0,.45);font:12px/1.6 Consolas,monospace;';
        panel.innerHTML='<div style="display:flex;align-items:center;gap:8px;padding:7px 12px;background:#1e293b;">'
            +'<b style="color:#e2e8f0">诊断控制台</b><span style="color:#64748b">连点三次品牌图标开合</span>'
            +'<button data-c style="margin-left:auto;background:none;border:none;color:#94a3b8;cursor:pointer;font-size:12px;">清空</button>'
            +'<button data-x style="background:none;border:none;color:#94a3b8;cursor:pointer;font-size:14px;">×</button></div>'
            +'<pre style="margin:0;padding:10px 12px;overflow:auto;white-space:pre-wrap;max-height:44vh;"></pre>';
        panel.querySelector('[data-c]').onclick=function(){logs.length=0;render();};
        panel.querySelector('[data-x]').onclick=function(){panel.style.display='none';};
        document.body.appendChild(panel);
    }
    function toggle(){
        try{
            if(!panel) build();
            var show = panel.style.display!=='flex';
            panel.style.display = show?'flex':'none';
            if(show) render();
        }catch(e){ console.error('[diag]', e); }
    }
    var clicks=0, timer=null;
    function boot(){
        var fab=document.querySelector('.brand-fab');
        if(!fab) return;
        fab.style.pointerEvents='auto';
        fab.style.cursor='pointer';
        fab.addEventListener('click',function(){
            clicks++; clearTimeout(timer);
            timer=setTimeout(function(){ clicks=0; },700);
            if(clicks>=3){ clicks=0; toggle(); }
        });
    }
    if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot);
    else boot();
})();
</script>

  "ocrDesc": "1927年9月9日，以毛泽东为书记的中共湖南省委前敌委员会，将参加起义的各路武装5000余人统编为工农革命军第一师，于9月9日发动湘闽边界秋收起义。在攻打中心城市长沙受挫后，毛泽东果断改变计划，率部队退到浏阳文家市集中，主持召开前委会议，决定到敌人统治力量薄弱的农村山区寻找落脚点。",
  "bg": "1927年9月，中国共产党在湖南、江西边界领导发动秋收起义，由于敌强我弱，起义受挫，毛泽东决定改变攻打长沙的计划，改为向敌人统治力量薄弱的农村转移。",

  "desc": "毛泽东在江西永新三湾村对秋收起义部队进行改编，确立支部建在连上，奠定新型人民军队建设基础。",

  "ocrDesc": "1927年9月29日,毛泽东领导起义军在江西永新县三湾村进行了著名的三湾改编，将党的支部建在连上，成立各级士兵委员会，实行民主制度，在政治上官兵平等。由此开始改变起义军中旧军队的习气和不良作风，从组织上确立了党对军队的领导，是建设无产阶级领导的新型人民军队的重要开端。",
  "bg": "1927年9月29日，毛泽东率领的秋收起义部队在江西吉安永新县三湾村遭遇了严重的困境，部队人数大幅减少，组织松散，思想混乱。为了巩固这支新生的革命军队，毛泽东决定对部队进行整顿和改编。",
  "significance": "三湾改编是中国共产党建设新型人民军队最早的一次成功探索和实践。它确立了‘党指挥枪’‘支部建在连上’‘官兵平等’等人民军队建军原则，确立了党对军队的绝对领导，具有深远的历史意义。",

   "三湾改编是中国共产党建设新型人民军队最早的一次成功探索和实践，它创造性地确立了‘党指挥枪’‘支部建在连上’‘官兵平等’等人民军队建军原则，确立了党对军队的绝对领导，在人民军队的建军史上具有无比重要的意义。"

  "source": "《中国共产党简史》+ 星火日历",
  "ocrDesc": "为发展同新兴民族独立国家尤其是邻近的民族独立国家的关系，1953年12月，我国政府在同印度就两国间存在的问题特别是印度与中国西藏地方关系问题的谈判中，首次提出和平共处五项原则，其表述后来确定为:互相尊重主权和和领土完整、互不侵犯、互不干涉内政、平等互利、和平共处。和平共处五项原则的提出，具有重大的战略意义。",
  "bg": "背景：第二次世界大战结束后，亚非拉民族独立解放事业蓬勃发展，新生的国家渴望建立平等的国际关系。和平共处五项原则在此背景下应运而生，由周恩来总理首次完整提出。这一原则旨在指导不同社会制度国家间相处的准则，后来扩展为指导一般国际关系的基本原则。",
  "significance": "历史意义：和平共处五项原则被世界各国普遍接受和认可，成为现代国际关系的重要准则。它为推动建立新型国际关系作出了历史性贡献，为各国妥处分歧提供了指导原则，同时也成为国际关系基本准则和国际法基本原则。在当前国际形势动荡不安的背景下，坚持和弘扬和平共处五项原则尤为重要。",

  "source": "《中国共产党简史》+ 星火日历",
  "ocrDesc": "三、农村改革、创办经济特区和改革开放的起步调整国民经济为了纠正多年来经济建设指导方针的偏差，解决“文化大革命”结束后国民经济比例关系失调的问题,1979年4月，党中央吾开工作会议，正式确立对国民经济实行“调整、改230革、整顿、提高”的方针，通称新“八字方针”。贯彻新“八字方针”，不但是调整经济关系的重要步又，也是端正经济建设指导方针、探索适合中国国情的社会主义现代化建设道路的过程，是推进改革开放的过程。",

  "source": "星火日历",
  "ocrDesc": "第十一届亚洲运动会于1990年9月22日至10月7日在中国北京举行，会期16天。这是中国首次承办亚运会，并且首次在社会主义国家举办。本届比赛共有31个国家参赛，运动员人数达6,122名，涵盖了27个比赛项目。中国此前未涉足的项目如皮划艇、卡巴迪等首次出现在赛场上，而跆拳道、马术等项目未被纳入。台湾以中華台北名义首次参赛，澳门、文莱、巴勒斯坦也是首次参加。运动会期间，大部分项目在北京举行，新建场馆20座，改建或扩建13座。帆船比赛移至秦皇島举行。亚奥理事会主席谢赫·法赫德亲王不幸阵亡，导致运动会氛围沉闷。赛事共打破7项世界纪录和89项亚洲纪录，平1项世界纪录和7项亚洲纪录。",

  "desc": "1993年4月27日，海协会会长汪道涵与海基会董事长辜振甫在新加坡举行首次会谈，签署四项协议，是1949年以来两岸高层首次公开会晤。",

  "ocrDesc": "1993年4月，海协会会长汪道涵同台湾海基会董事长辜振甫在新加坡成功举行会谈，签署《汪境会谈共同协议》等四项协议，建立了两岸制度化联系与协商机制，标志着两岸关系迈出了重要一步。1994年3月，八届全国人大常委会第六次会议通过《中华人民共和国台湾同胞投资保护法》，将保护台商投资纳入法制化轨道，进一步促进了两岸经济关系的发展和其他方面交流的扩大。",
  "bg": "1993年4月27日至29日，汪辜会谈在新加坡举行，两岸对峙了半个世纪后首次展开官方对话，对推动两岸关系具有重要历史意义。会谈前，两岸因台湾当局的“不接触、不谈判、不妥协”三不政策而处于隔绝状态，台湾当局成立了海基会，大陆成立了海协会，双方通过这两个民间团体进行协商。会谈后，两岸制度性协商机制得以确立，尽管遭遇波折，但为后续的两岸交流与政治对话奠定了基础。",
  "significance": "汪辜会谈标志着两岸关系从对峙走向对话的历史性转折点，不仅确立了两岸官方对话的新模式，还确立了“九二共识”作为两岸协商基础的重要原则。会谈为后续的两岸交流与政治对话奠定了基础，是两岸关系发展的重要里程碑。",

  "desc": "1994年起实施分税制和汇率并轨，理顺中央与地方、国家与企业分配关系。",
  "cat": "party",
  "source": "星火日历",
  "ocrDesc": "1994年9月1日，中华人民共和国政府实施了分税制改革，旨在将税收管理权高度集中于中央政府，调整中央和地方政府之间的税收分配制度及税收结构。此改革标志着财政体制从计划经济向市场经济的转变。虽然改革有效缓解了中央财政赤字，但也增加了地方政府的财政负担，推动了土地财政和房价上涨。2018年，国税地税合并后，分税制改革成为历史，其后续效应仍在观察中。",
  "bg": "1994年，中国实施了分税制改革，旨在建立合乎市场经济要求的政府间分权型财政模式框架。该改革将税收按税种划分中央与地方收入，并建立了政府间转移支付制度。然而，随着时间推移，分税制改革也暴露出诸如‘土地财政’等问题。",
  "significance": "分税制改革奠定了中央和地方财政分配关系的基本格局，提升了中央财政收入，增强了中央的宏观调控能力，初步实现了央地财政关系的规范化和制度化。然而，随着经济形势变化，分税制也出现了局限性和缺陷，需要进一步深化和调整。",
  "quotes": [
   "此次'营改增'，是 1994年财税体制改革进入扫尾阶段的一次重要改革。",

  "bg": "中国幅员辽阔，不同地区自然环境和发展条件差异较大，长期以来发展不平衡、不协调。邓小平早在1988年就提出了‘两个大局’的战略构想，强调沿海地区要加快对外开放，带动内地发展，同时内地也要顾全大局。1997年，江泽民在陕西、甘肃考察期间开始思考加快西部地区的发展问题。1999年9月，党的十五届四中全会作出实施西部大开发战略的决定。",
  "significance": "实施西部大开发战略是党中央总揽全局作出的重大战略决策，对于推动东西部地区协调发展和最终实现共同富裕，维护民族团结、社会稳定和国家安全，扩展国家发展的战略回旋空间具有重大而深远的意义。",

  "desc": "2000年2月江泽民在广东考察提出“三个代表”重要思想。",
  "cat": "party",

  "ocrDesc": "2000年2月21日至25日,江泽民在广东考察工作时明确提出“三个代表”要求。他指出:“我们党所以赢得人民的拥护，是因为我们党在革命、建设、改革的各个历史时329期，总是代表着中国先进生产力的发展要求，代表着中国先进文化的前进方向，代表着中国最广大人民的根本利益，并通过制定正确的路线方针政策，为实现国家和人民的根本利益而不懈奋斗。",
  "bg": "在推进中国特色社会主义伟大事业和党的建设新的伟大工程进程中，江泽民同志深入思考了新的历史条件下党所面临的新情况新问题，逐步提出了‘三个代表’重要思想，强调了党的先进性和执政能力的重要性。",
  "significance": "‘三个代表’重要思想是对马克思列宁主义、毛泽东思想、邓小平理论的继承和发展，反映了当代世界和中国的发展变化对党和国家工作的新要求，是中国共产党始终保持先进性的历史经验的基本总结，是加强和改进党的建设、推进我国社会主义自我完善和发展的强大理论武器。",
  "quotes": [
   "我们党要始终代表中国先进生产力的发展要求，就是党的理论、路线、纲领、方针、政策和各项工作，必须努力符合生产力发展的规律，体现不断推动社会生产力的解放和发展的要求，尤其要体现推动先进生产力发展的要求。",
   "我们党要始终代表中国先进文化的前进方向，就是党的理论、路线、纲领、方针、政策和各项工作，必须努力体现发展面向现代化、面向世界、面向未来的，民族的科学的大众的社会主义文化的要求。",
   "我们党要始终代表中国最广大人民的根本利益，就是党的理论、路线、纲领、方针、政策和各项工作，必须坚持把人民的根本利益作为出发点和归宿，充分发挥人民群众的积极性、主动性、创造性，在社会不断发展进步的基础上，使人民群众不断获得切实的经济、政治、文化利益。"

  "ocrDesc": "在此基础上，2001年6月,中、俄、哈、吉、塔和乌兹别克斯坦六国签署《上海合作组织成立宣言》”上海合作组织是第一个由中国参与推动建立并以中国城市命名的地RssmeERAS雄2001年10月21日,亚太经合组织第九次领导人非正式会议合影323区性合作组织，它所倡导的“互信、互利、平等、协商、尊重多样文明、谋求共同发展”的“上海精神”，在当代国际关系中产生了重要影响。上海合作组织成立后，各成员国在安全、经济和人文等方面加强交流合作，在反对霸权主义、强权政治，防范“颜色革命”方面发挥了重要作用，有力打击并遏制了暴力恐怖势力、民族分裂势力、宗教极端势力，维护了地区的总体稳定，促进了各成员国的经济社会发展。",

  "desc": "十届全国人大常委会决定自本日起废止农业税条例，存在2600年的古老税种宣告终结。",
  "cat": "nation",
  "source": "《中国共产党简史》第七章",
  "ocrDesc": "2006年1月1日，中国正式废止《农业税条例》，结束了农业税在中国存在几十年的历史。农业税始于《农业税条例》颁布，主要以实物形式征收，后转变为货币形式。随着经济的发展，农业税占财政收入的比例逐渐减少。至2001年，农业税收入仅占国家税收总额的1.87%。此次废止标志着中国农业税时代的结束，进一步减轻了农民负担，促进了农村经济的发展。",
  "bg": "背景(80-150字)：自1958年《中华人民共和国农业税条例》通过以来，农业税在我国存在了近半个世纪。随着1980年代中后期农民负担问题的逐步突出，中央开始重视减轻农民负担，经过多个阶段的努力，从1990年开始，中央着重解决国家税收之外对农民的各种收费、罚款和摊派问题。进入新世纪后，税费改革按照'减轻、规范、稳定'的目标进行试点，最终在2004年开始，中央明确提出了取消农业税的目标。",
  "significance": "历史意义(80-150字)：2006年1月1日起废止《中华人民共和国农业税条例》，标志着国家不再针对农业单独征税，终结了存在两千多年的农业税，给亿万农民带来了看得见的物质利益，极大地调动了农民的积极性，解放了农村生产力。",

  "bg": "2014年10月，中国共产党十八届四中全会决定召开，主要议程是讨论研究全面推进依法治国的重大问题。会议分析了上半年经济形势和下半年经济工作，强调依法治国的重要性，并指出我国正处于社会主义初级阶段，改革进入攻坚期和深水区，需全面深化改革，推动经济发展和社会稳定。",

  "cat": "nation",

  "title": "习近平提出人类命运共同体理念",
  "desc": "在联合国日内瓦总部主旨演讲中，习近平系统阐释构建人类命运共同体，回答“世界怎么了”。",
  "cat": "party",
  "source": "《中国共产党简史》第八章",
  "ocrDesc": "2017年1月18日，中共中央总书记习近平提出‘构建人类命运共同体’理念。这一理念在中共十九大上被写入《中国共产党章程》，并在2018年修宪时纳入《中华人民共和国宪法》序言。该理念强调各国前途命运紧密相连，倡导全球合作，实现共同繁荣。“人类命运共同体”成为体现中国智慧的价值观。",
  "bg": "2017年1月18日，习近平主席在日内瓦万国宫的高级别会议上发表了关于构建人类命运共同体的主旨演讲。这一理念自2013年首次提出以来，已在全球范围内产生深远影响。它旨在推动国际社会共同应对全球挑战，构建一个更加美好的世界。",
  "significance": "人类命运共同体理念是习近平主席提出的具有深远影响的国际关系理论。该理念不仅丰富和发展了中国特色大国外交思想，也为全球治理提供了新的思路和方案。它推动了中国与世界各国在多个领域的合作与交流，增强了国际社会对构建人类命运共同体的信心。",
  "quotes": [
   "中国已成为多边主义的重要支柱，而我们践行多边主义的目的，就是要建立人类命运共同体。",
   "推动构建人类命运共同体，不是以一种制度代替另一种制度，不是以一种文明代替另一种文明，而是不同社会制度、不同意识形态、不同历史文化、不同发展水平的国家在国际事务中利益共生、权利共享、责任共担，形成共建美好世界的最大公约数。",

  "cat": "party",
  "source": "星火日历",
  "ocrDesc": "2017年4月1日，中共中央、国务院决定设立雄安新区，作为继深圳经济特区和上海浦东新区之后又一具有全国意义的新区。雄安新区位于河北省雄县、容城、安新三县及周边区域，规划范围涉及雄县、容城、安新三县及周边部分地区。雄安新区旨在打造绿色生态宜居新城区、创新驱动发展引领区、协调发展示范区、开放发展先行区，形成北京非首都功能疏解集中承载地。",

  "ocrDesc": "2024年巴黎夏季奥运会将于7月26日举行，这是现代奥林匹克运动会的第33届赛事。现代奥运会自1896年起每4年举办一次，其灵感源自古代奥林匹克运动会。历史上，奥运会曾因一战和二战中断三次，冷战时期和2019冠状病毒病疫情也影响了部分奥运会的举办。",
  "bg": "背景：自党的十八大以来，党中央高度重视体育事业的发展，提出建设体育强国的战略目标，强调体育强国建设对于国家整体发展的重要性。2024年巴黎奥运会展示了中国体育健儿的努力和成果，突显了中国体育事业的全面发展。",
  "significance": "历史意义：自党的十八大以来，中国体育事业取得了显著成就，实现了从体育大国向体育强国的转变。这一转变不仅体现在竞技体育的成绩上，还体现在全民健身活动的广泛开展和体育基础设施的显著改善，彰显了国家对人民健康和幸福生活的重视。",
  "quotes": [
   "建设体育强国是中国国家整体发展的重要组成部分。建设体育强国，是全面建设社会主义现代化国家的一个重要目标。",
   "加快建设体育强国，就要坚持以人民为中心的思想，把人民作为发展体育事业的主体，把满足人民健身需求、促进人的全面发展作为体育工作的出发点和落脚点。",
   "中国体育代表团的优异成绩，既是我国体育事业发展进步的集中体现，也是中国式现代化建设成就的一个缩影，充分彰显了新时代中国力量。"

const byDate = {};
historyData.forEach(e => { const k = e.year + '-' + e.month + '-' + e.day; (byDate[k] = byDate[k] || []).push(e); });
function keyOf(e){ return e.year + '-' + e.month + '-' + e.day; }
function eventsOfKey(k){ return byDate[k] || []; }
function causesOf(k){ return (CAUSAL[k] || []).map(eventsOfKey).flat(); }
function causedByOf(k){
  const res = [];
  for(const src in CAUSAL){ if((CAUSAL[src] || []).includes(k)) res.push(...eventsOfKey(src)); }
  return res;
}
// 因果闭包（上溯前因、下探后续，含传递关系），用于时间轴高亮
function causalClosure(k){
  const seen = new Set([k]); const q = [k];
  while(q.length){
    const cur = q.shift();
    const nxt = [...(CAUSAL[cur] || []), ...Object.keys(CAUSAL).filter(s => (CAUSAL[s] || []).includes(cur))];
    nxt.forEach(n => { if(!seen.has(n)){ seen.add(n); q.push(n); } });
  }
  return seen;
}
// ===================== 因果网络关系图（替代时间轴高亮的因果脉络展示） =====================
// 把「因果」建模为事件节点 + 有向边（因→果）的网络图；点击节点以它为新根高亮整条脉络。
const cgNodes = (() => {
  const set = new Set();
  for(const k in CAUSAL){ set.add(k); (CAUSAL[k] || []).forEach(t => set.add(t)); }
  for(const k in CAUSAL_INFERRED){ set.add(k); (CAUSAL_INFERRED[k] || []).forEach(t => set.add(t)); }
  return [...set];
})();
const cgEdges = [];
for(const s in CAUSAL){ (CAUSAL[s] || []).forEach(t => cgEdges.push({from:s, to:t, type:'verified'})); }
for(const s in CAUSAL_INFERRED){ (CAUSAL_INFERRED[s] || []).forEach(t => cgEdges.push({from:s, to:t, type:'inferred'})); }
const cgCoreNodes = new Set();
for(const e of cgEdges){ if(e.type === 'verified'){ cgCoreNodes.add(e.from); cgCoreNodes.add(e.to); } }
const cgInferredOnly = new Set();
for(const k of cgNodes){ if(!cgCoreNodes.has(k)) cgInferredOnly.add(k); }

function causalClosureX(k){

// 层级脉络：从根沿前因/后续各 BFS depth 层（替代完整闭包，避免聚焦时显示上百节点）
function causalLayerX(k, depth){
  const adj = (x) => {
    const out = [];
    (CAUSAL[x] || []).forEach(t => out.push(t));                 // 后续（x 是原因）
    for(const s in CAUSAL){ if((CAUSAL[s] || []).includes(x)) out.push(s); } // 前因（x 是结果）
    return out;
  };
  const dist = { [k]: 0 };
  let frontier = [k]; let layer = 0;
  while(frontier.length && layer < depth){
    const next = [];
    for(const cur of frontier){
      for(const nb of adj(cur)){
        if(!(nb in dist)){ dist[nb] = dist[cur] + 1; next.push(nb); }
      }
    }
    frontier = next; layer++;
  }
  const set = new Set(Object.keys(dist));
  if(cgShowInferred){
    const more = new Set(set);
    for(const e of cgEdges){
      if(e.type !== 'inferred') continue;
      if(set.has(e.from) && !more.has(e.to)) more.add(e.to);
      if(set.has(e.to) && !more.has(e.from)) more.add(e.from);
    }
    more.forEach(x => set.add(x));
  }

function cgFitToRoot(closure){

    if(p.y < minY) minY = p.y; if(p.y > maxY) maxY = p.y;
  }
  const pad = 80, VBW = 2200, VBH = 1500;
  const bw = Math.max(maxX - minX, 1), bh = Math.max(maxY - minY, 1);

    }

// D方案：因果图脉络侧栏列表（与 A+B 配合，根治聚焦视图“毛线团”的可读性方案）
function renderCgSide(){
  const wrap = document.getElementById('cgSideList');
  if(!wrap) return;
  wrap.innerHTML = '';
  if(!cgRoot){
    const p = document.createElement('div'); p.className = 'cg-side-empty';
    p.textContent = '点击图中任意节点，或从「重要脉络」选择入口，在此查看该事件的脉络事件列表。';
    wrap.appendChild(p); return;
  }
  const closure = causalLayerX(cgRoot, cgDepth);
  const hop = {}, dir = {};
  hop[cgRoot] = 0; dir[cgRoot] = 0;
  let fr = [cgRoot];
  while(fr.length){ const nx = []; for(const c of fr) for(const t of (CAUSAL[c] || [])){ if(!(t in hop)){ hop[t] = hop[c] + 1; dir[t] = 1; nx.push(t); } } fr = nx; }
  fr = [cgRoot];
  while(fr.length){ const nx = []; for(const c of fr) for(const s in CAUSAL){ if((CAUSAL[s] || []).includes(c) && !(s in hop)){ hop[s] = hop[c] + 1; dir[s] = -1; nx.push(s); } } fr = nx; }
  const yr = (k) => { const e = eventsOfKey(k)[0]; return e ? e.year : 0; };
  const rootEv = eventsOfKey(cgRoot)[0];
  wrap.appendChild(makeCgSideItem(cgRoot, rootEv, '当前根事件', true, 0));
  let cause = [], effect = [], other = [];
  for(const k of closure){
    if(k === cgRoot) continue;
    const e = eventsOfKey(k)[0]; if(!e) continue;
    const d = (k in dir) ? dir[k] : 0;
    const entry = { k: k, e: e, h: (k in hop) ? hop[k] : 0 };
    if(d === -1) cause.push(entry); else if(d === 1) effect.push(entry); else other.push(entry);
  }
  if(cgSideFilter !== 'all'){
    const f = (arr) => arr.filter(x => (x.e.cat || 'party') === cgSideFilter);
    cause = f(cause); effect = f(effect); other = f(other);
  }
  const byYear = (a, b) => (a.e.year - b.e.year) || ((a.e.month || 0) - (b.e.month || 0));
  cause.sort(byYear); effect.sort(byYear); other.sort(byYear);
  if(cause.length) wrap.appendChild(makeCgSideGroup('前因 · 导致此事发生（' + cause.length + '）', cause, -1));
  if(effect.length) wrap.appendChild(makeCgSideGroup('后续 · 此事导致的（' + effect.length + '）', effect, 1));
  if(other.length) wrap.appendChild(makeCgSideGroup('相关事件', other, 0));
}
function makeCgSideItem(k, e, tag, isRoot, gtype){
  const div = document.createElement('div');
  const cat = (e && e.cat === 'kmt') ? 'kmt' : (e && e.cat === 'nation') ? 'nation' : 'party';
  div.className = 'cg-side-item cg-g-' + gtype + ' cg-cat-' + cat + (k === cgRoot ? ' cg-active' : '');
  div.setAttribute('data-key', k);
  const top = document.createElement('div'); top.className = 'cg-side-top';
  const dot = document.createElement('span'); dot.className = 'cg-side-dot';
  const y = document.createElement('span'); y.className = 'cg-side-yr'; y.textContent = e.year + (e.month ? ('-' + e.month) : '');
  const t = document.createElement('span'); t.className = 'cg-side-title'; t.textContent = e.title;
  top.appendChild(dot); top.appendChild(y); top.appendChild(t);
  div.appendChild(top);
  if(tag){ const tg = document.createElement('span'); tg.className = 'cg-side-tag'; tg.textContent = tag; div.appendChild(tg); }
  // 每个事件右下角的「详情」按钮：替代原顶部「打开事件详情」
  const detail = document.createElement('button');
  detail.className = 'cg-side-detail';

  detail.addEventListener('click', (ev) => {

    // 不关闭因果图：详情弹窗叠加在因果网络图之上，关掉弹窗仍停留在因果图（在哪里打开就停在哪里），不再跳回底层页面
    if(e) openModal(e.month, e.day, [e]);
  });
  div.appendChild(detail);
  div.addEventListener('click', () => setCausalRoot(k));
  div.addEventListener('mouseenter', () => highlightCgNode(k, true));
  div.addEventListener('mouseleave', () => highlightCgNode(k, false));
  return div;
}
function makeCgSideGroup(label, items, dirSign){
  const g = document.createElement('div'); g.className = 'cg-side-group';
  const gh = dirSign < 0 ? 'cause' : dirSign > 0 ? 'effect' : 'other';
  const h = document.createElement('div'); h.className = 'cg-side-group-h cg-gh-' + gh; h.textContent = label; g.appendChild(h);
  const gtype = dirSign < 0 ? 1 : dirSign > 0 ? 2 : 3; // 1=前因 2=后续 3=相关
  for(const it of items){

    g.appendChild(makeCgSideItem(it.k, it.e, tag, false, gtype));
  }
  return g;
}

function inThreadRange(y, m, r){
  if(!r) return false;
  const v = y*12 + m, a = r[0]*12 + r[1], b = r[2]*12 + r[3];
  return v >= a && v <= b;
}
function applyThreadFilter(){

  const r = p ? p.range : null;
  items.forEach(it=>{

    it.classList.toggle('tl-hide', !inR);

function tint(count, max, cat){
    if(count <= 0) return "transparent";
    const ratio = max > 0 ? count / max : 0;
    const alpha = 0.10 + ratio * 0.32; // 0.10 ~ 0.42
    const rgb = (cat === 'kmt') ? '26,82,118' : (cat === 'nation') ? '183,121,31' : '178,34,34';

function renderCalendar(){
    const wrap = document.getElementById('calendarBody');
    wrap.innerHTML = "";
    const REF_YEAR = 2025; // 仅用于月历排版，与事件年份无关
    const daysInMonth = new Date(REF_YEAR, currentMonth, 0).getDate();
    const firstDayWeek = new Date(REF_YEAR, currentMonth-1, 1).getDay();
    const emptyStartCount = firstDayWeek === 0 ? 6 : firstDayWeek - 1;

    const allFiltered = getFilteredEvents();

    const dayCounts = {};
    allFiltered.forEach(e=>{ if(e.month === currentMonth) dayCounts[e.day] = (dayCounts[e.day]||0) + 1; });
    const maxDay = Math.max(1, ...Object.values(dayCounts));

    for(let i=0; i<emptyStartCount; i++){
        const div = document.createElement('div');
        div.className = "day-cell empty-day";
        wrap.appendChild(div);
    }

    for(let d=1; d<=daysInMonth; d++){
        const cell = document.createElement('div');
        const events = allFiltered.filter(item=>item.month === currentMonth && item.day === d);
        const count = dayCounts[d] || 0;
        // 本月空日：方案二「版式网格」——虚线框 + 淡灰日期 + 星火点（无事件不设档案金条）
        cell.className = "day-cell" + (count===0 ? " no-event" : "");
        // 该日事件全部属其他力量(kmt)时染蓝、全属国家大事(nation)时染金，否则默认朱砂红
        const dayKmt = count>0 && events.some(e=>e.cat==='kmt') &&
                       !events.some(e=>e.cat!=='kmt');
        const dayNation = count>0 && !dayKmt && events.some(e=>e.cat==='nation') &&
                          !events.some(e=>e.cat==='party' || e.cat==='kmt');
        cell.style.background = tint(count, maxDay, dayKmt ? 'kmt' : (dayNation ? 'nation' : 'party'));
        // 档案格顶部 3px 分类色条：蓝=其他力量主导 / 金=国家大事主导 / 朱砂=中共或混合
        if(count>0){
            cell.style.borderTopColor = dayKmt ? '#1a5276' : (dayNation ? '#b7791f' : '#b22222');
        }
        cell.innerHTML = `<div class="day-num">${d}日</div>`;

        events.slice(0,3).forEach(ev=>{
            const eDiv = document.createElement('div');
            eDiv.className = "event-item";
            eDiv.innerText = ev.title;
            // 单条事件按所属主题着色：其他力量(蓝色) / 中共(红色)
            eDiv.style.borderLeftColor = (ev.cat==='kmt') ? '#1a5276' : (ev.cat==='nation') ? '#b7791f' : '#b22222';
            cell.appendChild(eDiv);
        })
        if(events.length>3){
            const tip = document.createElement('div');
            tip.style.fontSize="11px";

            cell.appendChild(tip);

        cell.onclick = function(){

        }
        wrap.appendChild(cell);
    }
}

let currentModalEvents = [];   // 当前弹窗内的事件列表（用于 ↑↓ 键盘导航）
let currentModalIndex = 0;
let currentModalMonth = 0, currentModalDay = 0;
let modalBackFn = null;        // 事件详情的「返回上一层」回调（如标签云事件列表）

// ---------- 弹窗统一开关（带淡入淡出 + 弹性入场动效） ----------
let _modalFocusReturn = null;
function showModalMask(){
    const m = document.getElementById('modalMask');
    if(!m) return;
    _modalFocusReturn = document.activeElement;
    m.classList.remove('closing');
    m.style.display = "flex";
    // 强制 reflow 后再加 .show，确保过渡从 opacity:0 开始
    void m.offsetWidth;
    m.classList.add('show');
}
function hideModalMask(){
    const m = document.getElementById('modalMask');
    if(!m) return;
    m.classList.remove('show');
    m.classList.add('closing');
    setTimeout(function(){
        m.classList.remove('closing');
        if(!m.classList.contains('show')) m.style.display = "none";
    }, 220);
    if(_modalFocusReturn && _modalFocusReturn.focus){
        try { _modalFocusReturn.focus(); } catch(e){}
        _modalFocusReturn = null;
    }
}
function openModal(month, day, eventList, backFn){
    modalBackFn = backFn || null;
    currentModalEvents = eventList.slice();
    currentModalIndex = 0;
    currentModalMonth = month; currentModalDay = day;
    renderModalBody();
    showModalMask();
}

function renderModalBody(){
    const title = document.getElementById('modalTitle');
    const content = document.getElementById('modalContent');
    const month = currentModalMonth, day = currentModalDay;
    const yr = currentModalEvents.length ? currentModalEvents[currentModalIndex].year : '';

        content.appendChild(back);
    }
    if(currentModalEvents.length === 0){
        content.innerHTML = "<p>暂无记载事件</p>";
        return;
    }
    if(currentModalEvents.length > 1){
        const nav = document.createElement('div');
        nav.style.cssText = 'font-size:12px;color:#888;margin-bottom:10px;';
        nav.textContent = `共 ${currentModalEvents.length} 条，按 ↑ ↓ 切换（当前第 ${currentModalIndex+1} 条）`;
        content.appendChild(nav);

    const e = currentModalEvents[currentModalIndex];
    const div = document.createElement('div');
    div.className = "modal-event" + (e.cat==='kmt' ? " kmt" : e.cat==='nation' ? " nation" : "");

    div.appendChild(star);

    const body = document.createElement('div');
    body.innerHTML = `<div class="modal-event-title">${e.title}</div><span style="color:#555;font-size:14px;">${e.desc}</span>`;
    div.appendChild(body);

    // 史料详情面板（背景/历史意义/重要论述/相关人物/文献出处/延伸阅读）
    // 每个子块仅在存在数据时渲染；面板整体仅当有任一子块有数据时出现（优雅降级）。
    (function(){
      const d = {
        bg: e.bg || '',
        significance: e.significance || '',
        quotes: e.quotes || [],
        figures: e.figures || [],
        srcCite: e.srcCite || [],
        furtherReading: e.furtherReading || []
      };
      const has = d.bg || d.significance || d.quotes.length || d.figures.length || d.srcCite.length || d.furtherReading.length;
      if(!has) return;
      const panel = document.createElement('div');
      panel.className = 'ev-detail';
      const ph = document.createElement('div'); ph.className = 'ev-detail-h'; ph.textContent = '史料详情';
      panel.appendChild(ph);
      const addSub = (title, node) => {
        if(!node) return;
        const sb = document.createElement('div'); sb.className = 'ev-sub';
        const sh = document.createElement('div'); sh.className = 'ev-sub-h'; sh.textContent = title;
        sb.appendChild(sh); sb.appendChild(node); panel.appendChild(sb);
      };
      if(d.bg){ const n=document.createElement('div'); n.className='ev-sub-t'; n.textContent=d.bg; addSub('背景', n); }
      if(d.significance){ const n=document.createElement('div'); n.className='ev-sub-t'; n.textContent=d.significance; addSub('历史意义', n); }
      if(d.quotes.length){
        const box=document.createElement('div');
        d.quotes.forEach(q=>{
          const n=document.createElement('div'); n.className='ev-quote'; n.textContent='\u201c'+q+'\u201d';
          box.appendChild(n);
          /* 出处/作者线索：从引文自身提取《著作》与讲话人，并提供站外检索核对 */
          const meta=document.createElement('div'); meta.className='q-meta';
          const parts=[];
          const wm=q.match(/《([^》]{2,30})》/);
          if(wm) parts.push('出处：《'+wm[1]+'》');
          const sp=q.match(/^[\s\u201c]*([^，。；”\u201d]{2,14}?)(?:同志)?(?:在[^，。]{0,14})?(?:曾经)?(?:指出|强调|写道|号召|提出|说过)/);
          if(sp && /[\u4e00-\u9fff]/.test(sp[1])) parts.push(sp[1].trim());
          const a=document.createElement('a');
          a.href='https://search.12371.cn/search.php?t=newsmerge&client=no&q='+encodeURIComponent(q.slice(0,24));
          a.target='_blank'; a.rel='noopener';
          a.textContent=parts.length?'🔍 核对出处':'🔍 查找出处';
          meta.appendChild(document.createTextNode(parts.length?parts.join(' · ')+' · ':''));
          meta.appendChild(a);
          box.appendChild(meta);
        });
        addSub('重要论述', box);
      }
      if(d.figures.length){
        const box=document.createElement('div');
        d.figures.forEach(f=>{
          const n=document.createElement('span');

      if(d.srcCite.length){

          const a=document.createElement('a'); a.className='ev-link';
          if(m){
            a.textContent=m[1].replace(/[：:，,\-—–]\s*$/,'') || '查看链接';

            a.style.cursor='default';
            a.title='';
          }
          n.appendChild(a); box.appendChild(n);
        });
        addSub('文献出处', box);
      }
      if(d.furtherReading.length){
        const box=document.createElement('div');
        d.furtherReading.forEach(r=>{
          const a=document.createElement('a'); a.className='ev-link';
          const t = (r && r.title) ? r.title : r;
          a.textContent = t;
          if(r && r.url){ a.href=r.url; a.target='_blank'; a.rel='noopener'; a.title='🔗 '+r.url; } else { a.href='javascript:void(0)'; }
          box.appendChild(a);
        });
        addSub('延伸阅读', box);
      }
      div.appendChild(panel);
    })();

    // 因果脉络（前因 / 后续，可点击跳转）
    const causalBox = document.createElement('div');
    causalBox.className = 'ev-causal';
    const cBefore = causedByOf(keyOf(e));
    const cAfter = causesOf(keyOf(e));
    if(cBefore.length || cAfter.length){

      causalBox.appendChild(ch);

      }
      if(cAfter.length){

        causalBox.appendChild(sub);
        cAfter.forEach(x => causalBox.appendChild(makeCausalChip(x, 'after', e)));
      }
      const act = document.createElement('div'); act.className = 'causal-act';
      const ab = document.createElement('button'); ab.className = 'causal-link-btn'; ab.textContent = '查看因果网络图';
      ab.onclick = () => { closeModal(); openCausalGraph(keyOf(e), true); };
      act.appendChild(ab);
      causalBox.appendChild(act);
    }
    div.appendChild(causalBox);

    // 资料来源标注（优先事件自带 src，否则由来源数据库按分期/页码解析）
    const src = document.createElement('div');
    src.className = 'ev-source';
    src.textContent = resolveSource(e);
    div.appendChild(src);

    // 同类事件（置于详情页最末）
    const sameCat = historyData.filter(x=> x.cat===e.cat && x.title!==e.title)
        .sort((a,b)=> b.year-a.year).slice(0,8);

        const h = document.createElement('div'); h.className='ev-rel-h';

        catBox.appendChild(h);

            catBox.appendChild(c);
        });
        div.appendChild(catBox);
    }

    content.appendChild(div);

// ===================== 权威文献来源数据库（辅助逐条页码标注） =====================
// 用法（给某条事件补充精确出处）：
//   1) 最高优先级：在该事件对象上加 `src` 字段，如 src:"《简史》p.123"；
//   2) 或在本 sourceDB 中按 "年-月-日" 登记 { doc, page, note }，page 填印刷本页码
//      （在线版《一百年大事记》未分页，可用章节/时期定位，如 "上编·五四"）；
//   3) 未登记的事件由 periodOf(year) 自动归入党史分期，作为缺省出处，避免无来源署名。
const SOURCE_DOCS = {
    hundred:  { name:'《中国共产党一百年大事记》',          pub:'中共中央党史和文献研究院 / 人民网' },
    brief:    { name:'《中国共产党简史》',                  pub:'本书编写组，人民出版社·中共党史出版社 2021' },
    history:  { name:'《中国共产党历史》第一卷、第二卷',    pub:'中共中央党史研究室，中共党史出版社' },
    official: { name:'中华人民共和国中央人民政府网 / 人民网', pub:'www.gov.cn / www.people.com.cn' }
};
function periodOf(y){
    if(y < 1921) return { name:'建党前后（辛亥革命—中共一大）' };
    if(y < 1949) return { name:'新民主主义革命时期（1921—1949）' };
    if(y < 1978) return { name:'社会主义革命和建设时期（1949—1978）' };
    if(y < 2012) return { name:'改革开放和社会主义现代化建设新时期（1978—2012）' };
    return { name:'中国特色社会主义新时代（2012— ）' };
}
// 逐条来源登记：键为 "年-月-日"。page 填印刷本页码；在线版可写章节。留空("—")表示待标注。
// 示例（请按实际核对后补全页码）：
//   "1921-7-23": { doc:'hundred', page:'—', note:'中共一大在上海召开，后转嘉兴南湖' },
//   "1949-10-1": { doc:'hundred', page:'—', note:'开国大典' }
const sourceDB = {};
function resolveSource(e){
    const key = `${e.year}-${e.month}-${e.day}`;
    if(e.src) return '资料来源：' + e.src;
    const db = sourceDB[key];
    const per = periodOf(e.year);
    const docName = (db && SOURCE_DOCS[db.doc]) ? SOURCE_DOCS[db.doc].name : '《中国共产党一百年大事记》（人民网）';
    const page = (db && db.page && db.page !== '—') ? `· 第 ${db.page} 页` : '· 待标注页码';
    const note = (db && db.note) ? `（${db.note}）` : '';
    return `资料来源：${docName}（${per.name}）${page}${note}`;
}

const LOG_FALLBACK = '<p class="log-updated">更新日志加载失败</p>'
    + '<p>更新日志需通过 HTTP/HTTPS 访问加载（浏览器禁止 <code>file://</code> 下的本地读取）。'
    + '离线可打开项目内的 <code>CHANGELOG.md</code> 查看完整版本记录。</p>';
function loadLogHTML(cb){
    if (logHTML !== null) { cb(logHTML); return; }
    fetch('changelog.json', { cache: 'no-store' })
        .then(function(r){ if (!r.ok) { throw new Error('HTTP ' + r.status); } return r.json(); })
        .then(function(d){ logHTML = (d && d.html) ? d.html : LOG_FALLBACK; cb(logHTML); })
        .catch(function(){ logHTML = LOG_FALLBACK; cb(logHTML); });
}

let meetingFilter = 'all'; // 当前筛选类别
function openMeetings(){
    const mask = document.getElementById('modalMask');
    const title = document.getElementById('modalTitle');
    const content = document.getElementById('modalContent');
    title.textContent = '中共重要会议';
    content.innerHTML = '';
    // 类别筛选按钮
    const bar = document.createElement('div');
    bar.className = 'mtg-filter';
    const types = [
        ['all','全部'],
        ['congress','党代会（全国代表大会·几大）'],
        ['plenum','中央全会（几中全会）'],
        ['other','其他重要会议']
    ];
    types.forEach(([k,label])=>{
        const b = document.createElement('button');
        b.className = 'mtg-fbtn' + (k === meetingFilter ? ' active' : '');
        b.textContent = label;
        b.dataset.k = k;
        b.onclick = ()=>{ meetingFilter = k; updateMtgFilterBar(); renderMeetingList(); };
        bar.appendChild(b);
    });
    content.appendChild(bar);
    const list = document.createElement('div');
    list.id = 'mtgList';
    list.className = 'mtg-list';
    content.appendChild(list);
    renderMeetingList();
    showModalMask();
}
function updateMtgFilterBar(){
    document.querySelectorAll('.mtg-fbtn').forEach(b=>{
        b.classList.toggle('active', b.dataset.k === meetingFilter);
    });
}
function renderMeetingList(){
    const list = document.getElementById('mtgList');
    if(!list) return;
    list.innerHTML = '';
    const arr = meetingsData
        .filter(m => meetingFilter === 'all' || m.type === meetingFilter)
        .sort((a,b)=> a.year-b.year || a.month-b.month || a.day-b.day);
    if(arr.length === 0){ list.innerHTML = '<p style="color:#888">暂无该类别会议</p>'; return; }
    arr.forEach(m=>{
        const card = document.createElement('div');
        card.className = 'mtg-card mtg-' + m.type;
        const h = document.createElement('div');
        h.className = 'mtg-card-h';
        h.textContent = `${m.year}年${m.month}月${m.day}日 · ${m.title}`;
        const d = document.createElement('div');
        d.className = 'mtg-card-d';
        d.textContent = m.desc;
        const more = document.createElement('div');
        more.className = 'mtg-card-more';
        more.textContent = '点击查看详细内容 ›';
        card.appendChild(h); card.appendChild(d); card.appendChild(more);
        card.onclick = ()=> openMeetingDetail(m);
        list.appendChild(card);
    });
}

function openMeetingDetail(m){
    const mask = document.getElementById('modalMask');

    mstar.style.position = 'static';
    mstar.style.marginLeft = '8px';
    mstar.title = '收藏 / 取消收藏';

    content.appendChild(mstar);
    // 完整日期
    const dt = document.createElement('div');
    dt.className = 'mtg-detail-date';
    dt.textContent = `召开时间：${m.year}年${m.month}月${m.day}日`;
    content.appendChild(dt);
    // 完整描述
    const desc = document.createElement('div');
    desc.className = 'mtg-detail-desc';
    desc.textContent = m.desc;
    content.appendChild(desc);
    // 同日党史事件关联（同样尊重"仅看重大政治事件"筛选）
    const rel = softFilter(historyData.filter(e=> e.year===m.year && e.month===m.month && e.day===m.day && e.title!==m.title))
                            .sort((a,b)=> a.month-b.month || a.day-b.day);
    if(rel.length){
        const rh = document.createElement('div');
        rh.className = 'mtg-rel-h';
        rh.textContent = '同日党史事件';
        content.appendChild(rh);
        rel.forEach(e=>{
            const dv = document.createElement('div');
            dv.className = 'ev-entry' + (e.cat==='kmt' ? ' kmt' : e.cat==='nation' ? ' nation' : '');
            dv.innerHTML = `<div class="ee-date">${e.year}年${e.month}月${e.day}日</div><div class="ee-title">${e.title}</div>${e.desc?`<div class="ee-desc">${e.desc}</div>`:''}`;
            content.appendChild(dv);
        });
    }
    // 资料来源标注
    const msrc = document.createElement('div');
    msrc.className = 'ev-source';
    msrc.textContent = resolveSource(m);
    content.appendChild(msrc);
    showModalMask();
}

// 分类过滤（贯穿 日历 / 时间轴 / 右栏 / 搜索 / 导出 / 统计）
function softFilter(list){
    return list.filter(e=>{
        if(catFilter === 'party'    && (e.cat === 'kmt' || e.cat === 'nation')) return false;
        if(catFilter === 'kmt'      && e.cat !== 'kmt') return false;
        if(catFilter === 'nation'   && e.cat !== 'nation') return false;
        if(catFilter === 'soft'     && !e.soft) return false;
        if(catFilter === 'political' && e.soft) return false;
        return true;
    });
}

// ---------- 收藏 / 书签（localStorage 持久化） ----------
function loadFavs(){
    try { const s = localStorage.getItem('dangshi_favs'); return s ? JSON.parse(s) : []; }
    catch(e){ return []; }
}
function saveFavs(){ try { localStorage.setItem('dangshi_favs', JSON.stringify(favs)); } catch(e){} }
function favKey(e){ return `${e.year}-${e.month}-${e.day}-${e.title}`; }
function isFav(e){ return favs.includes(favKey(e)); }
function toggleFav(e, starEl){
    const k = favKey(e);
    const i = favs.indexOf(k);
    if(i >= 0){ favs.splice(i,1); if(starEl) starEl.classList.remove('on'); }
    else { favs.push(k); if(starEl) starEl.classList.add('on'); }
    saveFavs();
    const c = document.getElementById('favCount'); if(c) c.textContent = favs.length;
}

// ---------- 搜索命中高亮闪烁（I2） ----------
let hitFlashTimer = null;
function flashHits(){
    // 仅在结果被「搜索 / 分类」收窄时闪烁，避免默认全量时全盘闪烁
    const narrowing = searchKey.trim() !== "" || catFilter !== 'all';
    if(!narrowing) return;
    const targets = [
        ...document.querySelectorAll('#calendarBody .event-item'),
        ...document.querySelectorAll('#tlTrack .tl-card')
    ];
    targets.forEach(el=>{
        el.classList.remove('hit-flash');
        void el.offsetWidth; // 强制回流以重启动画
        el.classList.add('hit-flash');
    });
    if(hitFlashTimer) clearTimeout(hitFlashTimer);
    hitFlashTimer = setTimeout(()=>{
        document.querySelectorAll('.hit-flash').forEach(el=> el.classList.remove('hit-flash'));
    }, 3200); // 约 3 秒后自动清除
}

    const matched = getFilteredEvents();
    const monthsWith = [...new Set(matched.map(e=>e.month))].sort((a,b)=>a-b);
    const status = document.getElementById('statusText');
    if(searchKey.trim() === ""){

    // 弹窗内 Tab 焦点陷阱：循环在弹窗可聚焦元素间

/* ===== 电脑版：时间轴模式锁定页面竖向滚动，滚轮驱动时间轴向前/向后 =====
   作用域：仅桌面宽度(≥769px)+时间轴模式+滚轮位于时间轴轨道上；
   弹窗/因果图打开、工具栏控件、移动端 均交还原生行为 */
const TlWheel=(function(){
    const mq=window.matchMedia('(min-width: 769px)');
    let lockY=0;
    function allowed(e){
        if(!mq.matches) return false;
        const tv=document.getElementById('timelineView');
        if(!tv || !tv.classList.contains('show')) return false;
        const mask=document.getElementById('modalMask');
        if(mask && mask.classList.contains('show')) return false;   // 详情弹窗：内部滚动
        const cg=document.getElementById('cgOverlay');
        if(cg && (!cg.hidden || cg.classList.contains('show'))) return false; // 因果网络图全屏
        const t=e.target;
        if(!(t && t.closest && t.closest('#tlScrollWrap'))) return false;   // 仅轨道区域接管滚轮
        return true;
    }
    function setLock(on){
        const de=document.documentElement, bd=document.body;
        if(on){
            if(!bd.classList.contains('tl-noscroll')){
                lockY=window.scrollY||de.scrollTop||0;
                de.classList.add('tl-noscroll'); bd.classList.add('tl-noscroll');
            }
        }else if(bd.classList.contains('tl-noscroll')){
            de.classList.remove('tl-noscroll'); bd.classList.remove('tl-noscroll');
            window.scrollTo(0, lockY||0);
        }
    }
    function sync(on){ setLock(!!on && mq.matches); }
    window.addEventListener('wheel', function(e){
        if(!allowed(e)) return;              // 其余场景交给原生滚动
        e.preventDefault();
        setLock(true);
        const d=(Math.abs(e.deltaY)>=Math.abs(e.deltaX))?e.deltaY:e.deltaX;
        document.getElementById('tlScroll').scrollLeft += d;   // 下滚=向未来，上滚=回溯
    }, {passive:false});
    window.addEventListener('resize', ()=>sync(document.getElementById('timelineView').classList.contains('show')));
    return {sync:sync};
})();

        const h = (window.visualViewport && window.visualViewport.height) || window.innerHeight;

/* 年份虚影：以分割线中心为界切分年段，浅印大字落于段内空白（卡片上下错位留出的中轴带） */
function layoutYearGhosts(yearSeps, track){
    if(!track) return;
    track.querySelectorAll(':scope > .tyw').forEach(function(g){ g.remove(); });
    var W = track.scrollWidth || track.offsetWidth;
    for(var idx=0; idx<yearSeps.length; idx++){
        var s = yearSeps[idx];
        var nxt = yearSeps[idx+1] && yearSeps[idx+1].el;
        var start = s.el.offsetLeft + s.el.offsetWidth/2;
        var end = nxt ? (nxt.offsetLeft + nxt.offsetWidth/2)
                      : (W - 60);
        if(end - start < 80) continue;
        var g = document.createElement('div');
        g.className = 'tyw';
        g.setAttribute('aria-hidden','true');
        g.textContent = s.y;
        g.style.left = start + 'px';
        g.style.width = (end - start) + 'px';
        track.insertBefore(g, nxt || null);
    }
}
window.addEventListener('resize', function(){
    try{
        var a = window.__ygArgs;
        var tv = document.getElementById('timelineView');
        if(a && tv && tv.classList.contains('show')) layoutYearGhosts(a[0], a[1]);
    }catch(_){}
});

        // 降级 / 动画进行中：直接静态切换
        if(reduced || modeAnimating){ cal.style.display = 'none'; return; }
        modeAnimating = true;
        cal.classList.remove('tear-out','tear-in');
        cal.style.display = 'none';   // 进入时间轴：日历直接隐藏（毛边动画仅用于切年）

        setTimeout(()=>{ wrap.classList.remove('unroll'); modeAnimating = false; }, 840);
    }else{
        modeCalendar.classList.add('active'); modeTimeline.classList.remove('active');
        setExtras(true);
        TlWheel.sync(false);  // 离开时间轴：恢复页面滚动
        cal.classList.remove('tear-out','tear-in');
        cal.style.display = '';
        // 降级 / 动画进行中：直接静态切换
        if(reduced || modeAnimating){ tl.classList.remove('show'); return; }
        modeAnimating = true;
        wrap.classList.remove('unroll'); void wrap.offsetWidth;
        wrap.classList.add('roll-up'); // 离开时间轴：横卷收拢回中心 + 轴杆回中淡出

    }

function positionModePill(){
    const sw = document.querySelector('.mode-switch');
    const pill = sw && sw.querySelector('.mode-pill');
    if(!pill) return;
    const active = sw.querySelector('.mode-btn.active') || sw.querySelector('.mode-btn');
    if(!active) return;
    /* 首次定位瞬时不带动画，避免从 0 尺寸生长；之后切换模式才滑行 */
    const noAnim = !pill.dataset.placed;
    if(noAnim) pill.style.transition = 'none';
    pill.style.top = active.offsetTop + 'px';
    pill.style.height = active.offsetHeight + 'px';
    pill.style.width = active.offsetWidth + 'px';
    pill.style.transform = 'translateX(' + active.offsetLeft + 'px)';
    if(noAnim){
        pill.dataset.placed = '1';
        void pill.offsetWidth;          /* 强制重排后恢复过渡 */
        pill.style.transition = '';
    }
}

// 横向拖动 + 滚轮 + 触摸
(function initTimelineDrag(){
    const sc = document.getElementById('tlScroll');
    let isDown=false, startX=0, startScroll=0, moved=false;
    sc.addEventListener('mousedown', (e)=>{
        isDown=true; moved=false;
        startX = e.pageX; startScroll = sc.scrollLeft;
        sc.classList.add('dragging');
    });
    window.addEventListener('mouseup', ()=>{
        isDown=false; sc.classList.remove('dragging');
    });
    sc.addEventListener('mousemove', (e)=>{
        if(!isDown) return;
        const dx = e.pageX - startX;
        if(Math.abs(dx) > 4) moved = true;
        sc.scrollLeft = startScroll - dx;
    });
    // 拖动结束后抑制误触卡片点击
    sc.addEventListener('click', (e)=>{
        if(moved){ e.stopPropagation(); e.preventDefault(); }
    }, true);
    sc.addEventListener('touchend', ()=>{ moved = false; });
    // 鼠标滚轮纵向 -> 横向滚动（仅当页面无需纵向滚动时劫持；手机横屏/矮视口页面可滚则放行，避免页面永远无法上下滚）
    sc.addEventListener('wheel', (e)=>{
        if(e.deltaY !== 0 && !e.shiftKey){
            const doc = document.scrollingElement;
            if(doc && doc.scrollHeight > window.innerHeight) return;
            sc.scrollLeft += e.deltaY;
            e.preventDefault();
        }
    }, {passive:false});
})();

function findEventByKey(k){
    for(const e of historyData){ if(favKey(e) === k) return {kind:'hist', e}; }
    for(const m of meetingsData){ if(favKey(m) === k) return {kind:'mtg', e:m}; }
    return null;
}
function openFavorites(){
    const title = document.getElementById('modalTitle');
    const content = document.getElementById('modalContent');
    title.textContent = "我的收藏";
    content.innerHTML = "";
    if(favs.length === 0){
        content.innerHTML = '<p class="fav-empty">还没有收藏任何事件。点击日历 / 时间轴 / 会议详情右上角的 ☆ 即可收藏，方便日后回看。</p>';
        showModalMask();
        return;
    }
    favs.slice().reverse().forEach(k=>{
        const found = findEventByKey(k);
        if(!found) return;
        const e = found.e;
        const div = document.createElement('div');
        div.className = "ev-entry" + (e.cat==='kmt' ? " kmt" : e.cat==='nation' ? " nation" : "");

        star.textContent = '★';

            ev.stopPropagation();
            toggleFav(e, star);
            openFavorites(); // 刷新列表
        };
        div.appendChild(star);
        const head = (found.kind === 'mtg') ? `${e.year}年${e.month}月${e.day}日 · ${e.title}（会议）` : `${e.year}年${e.month}月${e.day}日`;
        const dateEl = document.createElement('div');
        dateEl.className = 'ee-date';
        dateEl.textContent = head;
        const titleEl = document.createElement('div');
        titleEl.className = 'ee-title';
        titleEl.textContent = e.title;

        div.appendChild(titleEl);
        if(e.desc){

            descEl.className = 'ee-desc';
            descEl.textContent = e.desc;

        row.onclick = ()=> openModal(e.month, e.day, [e], ()=> openStats());

    sumEl.after(panel);
}

function toggleYearSegList(year, cat, label, anchor){
    const prev = document.getElementById('yearSegList');
    if(prev){
        if(prev.dataset.year == year && prev.dataset.cat == cat){ prev.remove(); return; }
        prev.remove();

    let l = historyData.filter(e => e.year === year);
    if(cat === 'party') l = l.filter(e => e.cat !== 'kmt' && e.cat !== 'nation' && !e.soft);
    else if(cat === 'soft') l = l.filter(e => e.cat !== 'kmt' && e.soft);
    else if(cat === 'kmt') l = l.filter(e => e.cat === 'kmt');
    else if(cat === 'nation') l = l.filter(e => e.cat === 'nation');
    l.sort((a,b)=> a.month-b.month || a.day-b.day);

    const headTxt = document.createElement('span');
    headTxt.textContent = `${year}年 · ${label} · 共 ${l.length} 个事件`;
    const close = document.createElement('span');
    close.textContent = '收起 ✕';
    close.style.cssText = 'cursor:pointer;color:#999;font-weight:normal;font-size:12px;';
    close.onclick = (ev)=>{ ev.stopPropagation(); panel.remove(); };
    head.appendChild(headTxt); head.appendChild(close);
    panel.appendChild(head);
    const wrap = document.createElement('div');
    wrap.style.cssText = 'display:flex;flex-direction:column;gap:6px;max-height:44vh;overflow:auto;';
    if(l.length === 0){
        const p = document.createElement('p'); p.style.cssText='color:#999;font-size:13px;'; p.textContent='暂无事件。';

// ---------- 统计可视化（按年份柱状图 + 分类概览） ----------
function openStats(){
    const title = document.getElementById('modalTitle');
    const content = document.getElementById('modalContent');
    title.textContent = "事件统计";
    content.innerHTML = "";
    const list = softFilter(historyData.slice());
    const total = list.length;
    const party = list.filter(e=> e.cat !== 'kmt').length;
    const kmt = list.length - party;
    const soft = list.filter(e=> e.soft).length;

    const sum = document.createElement('div');
    sum.className = 'stat-summary';
    sum.innerHTML =
        `<div class="stat-card" data-cat="all"><div class="n">${total}</div><div class="l">当前筛选事件</div></div>` +
        `<div class="stat-card alt" data-cat="party"><div class="n">${party}</div><div class="l">中共相关</div></div>` +
        `<div class="stat-card alt" data-cat="kmt"><div class="n">${kmt}</div><div class="l">其他力量</div></div>` +
        `<div class="stat-card amber" data-cat="soft"><div class="n">${soft}</div><div class="l">科技·文教</div></div>`;
    content.appendChild(sum);
    sum.querySelectorAll('.stat-card').forEach(card=>{
        card.title = '点击展开该分类事件清单';
        card.onclick = ()=>{
            const cat = card.dataset.cat;
            const label = card.querySelector('.l').textContent;
            const existing = document.getElementById('statExpand');
            if(existing && existing.dataset.cat === cat){ existing.remove(); statExpandedCat = null; return; }
            expandStatCat(cat, label, sum);
        };
    });
    if(statExpandedCat) expandStatCat(statExpandedCat, STAT_CAT_LABEL[statExpandedCat], sum);

    // 按年份聚合
    const byYear = {};
    list.forEach(e=>{ byYear[e.year] = (byYear[e.year]||0) + 1; });
    const years = Object.keys(byYear).map(Number).sort((a,b)=>a-b);
    const maxC = Math.max(1, ...years.map(y=>byYear[y]));

    // 图例：多色分段（同一年的不同势力分色显示）
    const lg = document.createElement('div');
    lg.className = 'stat-legend';
    lg.innerHTML =
        '<span class="lg lg-party">■</span> 中共相关（非科技·文教）' +
        '<span class="lg lg-soft">■</span> 科技·文教' +
        '<span class="lg lg-kmt">■</span> 其他力量（国民党 / 国民政府等）';
    content.appendChild(lg);

    const t1 = document.createElement('div');
    t1.className = 'stat-chart-title';
    t1.textContent = `各年份事件数量（共 ${years.length} 个年份有记载，分段色示不同势力）`;
    content.appendChild(t1);

    const chart = document.createElement('div');
    chart.className = 'stat-chart';
    years.forEach(y=>{
        const c = byYear[y];
        const partyC = list.filter(e=> e.year===y && e.cat!=='kmt' && !e.soft).length; // 中共相关（非科技文教）
        const softC  = list.filter(e=> e.year===y && e.cat!=='kmt' &&  e.soft).length; // 科技·文教
        const kmtC   = list.filter(e=> e.year===y && e.cat==='kmt').length;            // 其他力量
        const row = document.createElement('div');
        row.className = 'stat-row';
        const yr = document.createElement('div'); yr.className='yr'; yr.textContent = y;
        const wrap = document.createElement('div'); wrap.className='stat-bar-wrap';
        const bar = document.createElement('div'); bar.className='stat-bar';
        bar.style.width = (c / maxC * 100).toFixed(1) + '%';
        const segP = document.createElement('span'); segP.className='seg seg-party'; segP.style.flexGrow = partyC; segP.title = '中共相关 ' + partyC + '（点击查看清单）';
        const segS = document.createElement('span'); segS.className='seg seg-soft';  segS.style.flexGrow = softC;  segS.title = '科技·文教 ' + softC + '（点击查看清单）';
        const segK = document.createElement('span'); segK.className='seg seg-kmt';   segK.style.flexGrow = kmtC;   segK.title = '其他力量 ' + kmtC + '（点击查看清单）';
        segP.onclick = () => toggleYearSegList(y, 'party', '中共相关', chart);
        segS.onclick = () => toggleYearSegList(y, 'soft', '科技·文教', chart);
        segK.onclick = () => toggleYearSegList(y, 'kmt', '其他力量', chart);
        bar.appendChild(segP); bar.appendChild(segS); bar.appendChild(segK);
        wrap.appendChild(bar);
        const cnt = document.createElement('div'); cnt.className='cnt'; cnt.textContent = c;
        row.appendChild(yr); row.appendChild(wrap); row.appendChild(cnt);
        chart.appendChild(row);
    });
    content.appendChild(chart);
    showModalMask();
}

function openTagCloud(){
    const title = document.getElementById('modalTitle');
    const content = document.getElementById('modalContent');
    title.textContent = "标签云 · 点击查看相关事件";
    content.innerHTML = "";
    const note = document.createElement('p');
    note.style.cssText = "color:#888;font-size:13px;margin-bottom:12px;";
    note.textContent = "点击下方标签，直接查看与它相关的全部事件：";
    content.appendChild(note);
    const base = historyData.slice();
    const cloud = document.createElement('div');
    cloud.className = 'tag-cloud';
    TAG_TERMS.forEach(term=>{
        const cnt = base.filter(e=> e.title.includes(term) || (e.desc && e.desc.includes(term))).length;
        if(cnt === 0) return;
        const tag = document.createElement('span');
        tag.className = 'tag' + (cnt >= 12 ? ' hot' : cnt >= 6 ? ' hot2' : '') + (term==='港澳'||term==='统一'||term==='外交'||term==='一国两制' ? ' kmt' : '');
        tag.textContent = `${term} (${cnt})`;
        tag.onclick = ()=> showTagEvents(term);
        cloud.appendChild(tag);
    });
    content.appendChild(cloud);
    showModalMask();
}

function downloadText(filename, text){
    const blob = new Blob([text], {type:"text/plain;charset=utf-8"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    a.click();
    URL.revokeObjectURL(url);
}
function buildExportRows(){
    // 当前筛选下的全量事件（含分类）
    return softFilter(historyData.slice())
        .sort((a,b)=> a.year-b.year || a.month-b.month || a.day-b.day);

function openExport(){

        {ico:'📑', t:'导出 PDF（打印）', d:'调用浏览器打印，可另存为 PDF', fn: exportPdf},
    ];
    const menu = document.createElement('div');

function exportMonthTxt(){
    const rows = buildExportRows().filter(e=> e.year===filterYear && e.month===currentMonth);
    let text = `【${filterYear}年${currentMonth}月 党史事件清单】\n\n`;
    rows.forEach(e=>{ text += `${e.month}月${e.day}日 ${e.year}年：${e.title}\n    ${e.desc}\n`; });
    if(rows.length === 0) text += "（本月暂无符合条件的事件）\n";
    downloadText(`${filterYear}年${currentMonth}月党史事件.txt`, text);
}
function exportYearTxt(){
    const rows = buildExportRows().filter(e=> e.year===filterYear);
    let text = `【${filterYear}年 党史事件清单】\n\n`;
    rows.forEach(e=>{ text += `${e.month}月${e.day}日 ${e.year}年：${e.title}\n    ${e.desc}\n`; });
    if(rows.length === 0) text += "（本年暂无符合条件的事件）\n";
    downloadText(`${filterYear}年党史事件.txt`, text);
}
function exportCsv(){
    let text = "年份,月份,日期,分类,标题,描述\n";
    buildExportRows().forEach(e=>{
        const cat = e.cat==='kmt' ? '其他力量' : (e.soft ? '科技·文教' : '中共相关');
        const esc = s => '"' + String(s).replace(/"/g,'""') + '"';
        text += `${e.year},${e.month},${e.day},${cat},${esc(e.title)},${esc(e.desc)}\n`;
    });
    downloadText('党史事件清单.csv', text);
}
function exportMarkdown(){
    let text = `# 星火日历 · 事件清单\n\n`;
    text += `> 筛选：${({all:'全部',party:'中共相关',kmt:'其他力量',soft:'科技·文教',political:'重大政治'}[catFilter]||'全部')}\n\n`;
    const rows = buildExportRows();
    let curYear = null;
    rows.forEach(e=>{
        if(e.year !== curYear){ curYear = e.year; text += `\n## ${e.year}年\n`; }
        text += `- **${e.month}月${e.day}日**：${e.title} — ${e.desc}\n`;
    });
    if(rows.length === 0) text += "\n（暂无符合条件的事件）\n";
    downloadText('党史事件清单.md', text);
}

// F3：将当前可见视图快照导出为矢量图片（SVG，离线无需第三方库）
function exportViewSvg(){
    const calView = document.getElementById('calendarView');
    const tlView  = document.getElementById('timelineView');
    const isTl = tlView.classList.contains('show');
    const visible = isTl ? tlView : calView;
    const clone = visible.cloneNode(true);
    const css = Array.from(document.querySelectorAll('style')).map(s=>s.textContent).join('\n');
    const w = Math.min(visible.scrollWidth || visible.clientWidth || 1000, 2400);
    const h = visible.scrollHeight || visible.clientHeight || 1400;
    const name = isTl ? '时间轴' : `${filterYear}年${currentMonth}月`;
    const svg =
        `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}">` +
        `<foreignObject x="0" y="0" width="${w}" height="${h}">` +
        `<div xmlns="http://www.w3.org/1999/xhtml" style="width:${w}px;">` +
        `<style>${css}</style>${clone.outerHTML}</div>` +
        `</foreignObject></svg>`;
    const blob = new Blob([svg], {type:'image/svg+xml;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `星火日历_${name}.svg`;
    a.click();
    URL.revokeObjectURL(url);
}

// 因果网络图：滚轮缩放与拖拽平移（鼠标中心缩放 + 拖拽阈值 + 平移边界 + 节点微调 + 触摸支持）
(function(){
  const canvas = document.getElementById('cgCanvas');
  if(!canvas) return;
  const LW = 2200, LH = 1500;   // 画布逻辑尺寸（与 build_causal_layout 一致）
  const TH = 4;                 // 拖拽阈值 px（区分 click 与 drag）
  const CG_MIN_SCALE = 0.3, CG_MAX_SCALE = 5;   // 缩放范围：手机可放大到 5x 看清节点

  function rect(){ return canvas.getBoundingClientRect(); }
  // SVG 设了 viewBox 0 0 2200 1500，且被等比缩放居中填满画布，故屏幕像素↔viewBox 单位需换算
  function vbInfo(){
    const r = rect();
    const vs = Math.min(r.width / 2200, r.height / 1500);
    const ox = (r.width - 2200 * vs) / 2, oy = (r.height - 1500 * vs) / 2;
    return { r, vs, ox, oy };
  }
  function toVB(clientX, clientY){
    const { r, vs, ox, oy } = vbInfo();
    return { x: (clientX - r.left - ox) / vs, y: (clientY - r.top - oy) / vs };
  }
  // 约束平移：全程使用 viewBox 单位（与 viewBox 窗口 2200×1500 一致），不再混用屏幕像素
  function clampPan(){
    const winW = 2200, winH = 1500;
    const iw = LW * cgScale, ih = LH * cgScale;
    if(iw <= winW){ cgTx = (winW - iw) / 2; }                 // 内容小于窗口：居中
    else { const keep = Math.min(winW * 0.35, iw * 0.35);      // 内容大于窗口：至少保留 35% 可见
           cgTx = Math.max(keep - iw, Math.min(winW - keep, cgTx)); }
    if(ih <= winH){ cgTy = (winH - ih) / 2; }
    else { const keep = Math.min(winH * 0.35, ih * 0.35);
           cgTy = Math.max(keep - ih, Math.min(winH - keep, cgTy)); }
  }
  window.cgClampPan = clampPan;

  // 滚轮缩放：以鼠标位置为中心
  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    const v = toVB(e.clientX, e.clientY);                       // 屏幕像素→viewBox 单位（指针下的点）
    const factor = e.deltaY < 0 ? 1.1 : 0.9;
    const ns = Math.max(CG_MIN_SCALE, Math.min(CG_MAX_SCALE, cgScale * factor));
    const bx = (v.x - cgTx) / cgScale, by = (v.y - cgTy) / cgScale;  // 指针下的布局点
    cgScale = ns;
    cgTx = v.x - bx * ns; cgTy = v.y - by * ns;                 // 保持该布局点不动（以指针为中心）
    clampPan(); applyCgTransform();
  }, {passive:false});

  // 鼠标平移（含阈值）；节点拖动由 window._cgNodeDrag 接管
  let down = false, moved = false, sx = 0, sy = 0;
  canvas.addEventListener('mousedown', (ev) => {
    ev.preventDefault();
    down = true; moved = false; sx = ev.clientX; sy = ev.clientY;
  });
  window.addEventListener('mousemove', (ev) => {
    // 节点拖动微调优先
    if(window._cgNodeDrag){
      const nd = window._cgNodeDrag;
      if(!nd.active){
        if(Math.hypot(ev.clientX - nd.startMx, ev.clientY - nd.startMy) < TH) return;
        nd.active = true;
      }
      const { vs } = vbInfo();
      const dx = (ev.clientX - nd.startMx) / (cgScale * vs);   // 屏幕位移 → viewBox 逻辑位移（含 viewBox 缩放）
      const dy = (ev.clientY - nd.startMy) / (cgScale * vs);
      const nx = nd.origX + dx, ny = nd.origY + dy;
      const pos = cgPos(nd.key);
      pos.x = nx; pos.y = ny;
      const g = document.querySelector('.cg-node[data-key="' + nd.key + '"]');
      if(g) g.setAttribute('transform', 'translate(' + nx + ',' + ny + ')');
      // 同步所有相关边
      document.querySelectorAll('.cg-edge[data-from="' + nd.key + '"],.cg-edge[data-to="' + nd.key + '"]').forEach(p => {
        const a = cgPos(p.getAttribute('data-from')), b = cgPos(p.getAttribute('data-to'));
        if(a && b) p.setAttribute('d', cgEdgePath(a, b));
      });
      window._cgNodeMoved = true;
      return;
    }
    if(!down) return;
    const dx = ev.clientX - sx, dy = ev.clientY - sy;
    if(!moved){ if(Math.hypot(dx, dy) < TH) return; moved = true; canvas.classList.add('dragging'); }
    const { vs } = vbInfo();
    cgTx += dx / vs; cgTy += dy / vs; sx = ev.clientX; sy = ev.clientY;
    clampPan(); applyCgTransform();
  });
  window.addEventListener('mouseup', () => {
    down = false; canvas.classList.remove('dragging');
    if(window._cgNodeDrag && !window._cgNodeDrag.active) window._cgNodeMoved = false;  // 未真正拖动，放行 click
    window._cgNodeDrag = null;
  });

  // 触摸支持：单指拖拽 + 双指 pinch 缩放
  let tDown = false, tMoved = false, tsx = 0, tsy = 0, pinchDist = 0, pinchCx = 0, pinchCy = 0, pinchScale = 1;
  canvas.addEventListener('touchstart', (e) => {
    if(e.touches.length === 1){
      tDown = true; tMoved = false; tsx = e.touches[0].clientX; tsy = e.touches[0].clientY;
    } else if(e.touches.length === 2){
      tDown = false;
      const dx = e.touches[0].clientX - e.touches[1].clientX, dy = e.touches[0].clientY - e.touches[1].clientY;
      pinchDist = Math.hypot(dx, dy) || 1;
      pinchCx = (e.touches[0].clientX + e.touches[1].clientX) / 2;
      pinchCy = (e.touches[0].clientY + e.touches[1].clientY) / 2;
      pinchScale = cgScale;
    }
  }, {passive:true});
  canvas.addEventListener('touchmove', (e) => {
    if(e.touches.length === 1 && tDown){
      e.preventDefault();
      const dx = e.touches[0].clientX - tsx, dy = e.touches[0].clientY - tsy;
      if(!tMoved){ if(Math.hypot(dx, dy) < TH) return; tMoved = true; }
      const { vs } = vbInfo();
      cgTx += dx / vs; cgTy += dy / vs; tsx = e.touches[0].clientX; tsy = e.touches[0].clientY;
      clampPan(); applyCgTransform();
    } else if(e.touches.length === 2){
      e.preventDefault();
      const dx = e.touches[0].clientX - e.touches[1].clientX, dy = e.touches[0].clientY - e.touches[1].clientY;
      const d = Math.hypot(dx, dy) || 1;
      const ns = Math.max(CG_MIN_SCALE, Math.min(CG_MAX_SCALE, pinchScale * (d / pinchDist)));
      const v = toVB(pinchCx, pinchCy);                         // 双指中点：屏幕像素→viewBox 单位
      const bx = (v.x - cgTx) / cgScale, by = (v.y - cgTy) / cgScale;
      cgScale = ns; cgTx = v.x - bx * ns; cgTy = v.y - by * ns;
      clampPan(); applyCgTransform();
    }
  }, {passive:false});
  canvas.addEventListener('touchend', () => { tDown = false; }, {passive:true});

  const closeX = document.getElementById('cgCloseX');
  if(closeX) closeX.onclick = closeCausalGraph;
  const resetBtn = document.getElementById('cgReset');
  if(resetBtn) resetBtn.onclick = () => {
    if(cgFocusMode && cgRoot) cgFitToRoot(causalLayerX(cgRoot, cgDepth));   // 聚焦模式：重置即重新居中
    else { cgScale = 1; cgTx = 0; cgTy = 0; clampPan(); applyCgTransform(); }
  };
  const focusBtn = document.getElementById('cgFocus');
  if(focusBtn) focusBtn.onclick = () => {
    cgFocusMode = !cgFocusMode;
    if(cgRoot) setCausalRoot(cgRoot); else applyCgFocus();
  };
  const inferBtn = document.getElementById('cgInfer');
  if(inferBtn) inferBtn.onclick = toggleCgInfer;
  const expandBtn = document.getElementById('cgExpand');
  if(expandBtn) expandBtn.onclick = () => { cgDepth++; setCausalRoot(cgRoot); };
  const shrinkBtn = document.getElementById('cgShrink');
  if(shrinkBtn) shrinkBtn.onclick = () => { if(cgDepth > 1){ cgDepth--; setCausalRoot(cgRoot); } };
  // 原「脉络事件列表」按钮已移除：列表在聚焦（脉络）视图默认展开，可用侧栏「−」收起、贴边「脉络事件列表」标签重新拉起
  const sideClose = document.getElementById('cgSideClose');
  if(sideClose) sideClose.onclick = () => { const p = document.getElementById('cgPanel'); if(p){ p.classList.add('cg-hide-side'); updateCgSideTab(); } };
  const sideTab = document.getElementById('cgSideTab');
  if(sideTab) sideTab.onclick = () => { const p = document.getElementById('cgPanel'); if(p){ p.classList.remove('cg-hide-side'); const s = document.getElementById('cgSide'); if(s) s.style.height = ''; updateCgSideTab(); } };
  // 手机端：底部抽屉顶部“小白条”拖拽，无极（连续）拖拽调整高度——默认 50%，上限 90vh 不铺满
  (function(){
    const grip = document.getElementById('cgSideGrip');
    const side = document.getElementById('cgSide');
    if(!grip || !side) return;
    let startY = 0, startH = 0, dragging = false;
    grip.addEventListener('touchstart', (e) => {
      dragging = true; startY = e.touches[0].clientY;
      startH = side.getBoundingClientRect().height;
      side.style.transition = 'none';
      e.stopPropagation();
    }, { passive: true });
    grip.addEventListener('touchmove', (e) => {
      if(!dragging) return;
      const dy = startY - e.touches[0].clientY;                 // 向上拖动为正
      const maxH = window.innerHeight * 0.9;
      const minH = Math.min(startH, window.innerHeight * 0.18);
      const h = Math.max(minH, Math.min(maxH, startH + dy));
      side.style.height = h + 'px';
      e.preventDefault();
      e.stopPropagation();
    }, { passive: false });
    grip.addEventListener('touchend', () => { dragging = false; side.style.transition = ''; }, { passive: true });
  })();
  const sideFilterBox = document.getElementById('cgSideFilter');
  if(sideFilterBox){
    sideFilterBox.querySelectorAll('.cg-fbtn').forEach(btn => {
      btn.onclick = () => {
        cgSideFilter = btn.getAttribute('data-f');
        sideFilterBox.querySelectorAll('.cg-fbtn').forEach(b => b.classList.toggle('active', b === btn));
        renderCgSide();
      };
    });
  }
  const lineageSel = document.getElementById('cgLineage');
  if(lineageSel) lineageSel.onchange = () => {
    const v = lineageSel.value;
    if(!v) return;
    openCausalGraph(v, true);
  };
  // 时间轴「历史时期」导航器：独立配置 PERIODS（按时期展示事件，不表达因果）
  const tlThread = document.getElementById('tlThread');
  if(tlThread){
    PERIODS.forEach(p=>{
      const o = document.createElement('option');
      o.value = p.name; o.textContent = p.name;
      tlThread.appendChild(o);
    });
    tlThread.addEventListener('change', ()=>{
      currentThread = tlThread.value;
      applyThreadFilter();
      if(currentThread) scrollToPeriod(); // T1：跳转滚动到该时期起点
      updateThreadUI();
    });
    const tlClear = document.getElementById('tlThreadClear');
    if(tlClear) tlClear.addEventListener('click', ()=>{
      currentThread = ""; tlThread.value = ""; applyThreadFilter(); updateThreadUI();
    });
  }
})();

document.getElementById('railClose').onclick = closeRail;
updateYearLabel();
renderMonthBar();
renderCalendar();
renderYearRail(filterYear);

// 顶栏（模式切换 / 工具栏 / 报头）恢复为普通文档流，随页面滚动；
// 仅悬浮按钮（logo、日夜切换、本年事件）保持 position:fixed 钉在背景板上。

</script>
</body>
