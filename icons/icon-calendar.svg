<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- 朱砂印身 -->
  <rect x="8" y="8" width="112" height="112" rx="22" fill="#8b1a1a"/>
  <!-- 宣纸印芯 -->
  <rect x="20" y="20" width="88" height="88" rx="12" fill="#f0e9d8"/>
  <!-- 印内框（细线，让位于日历主角） -->
  <rect x="26" y="26" width="76" height="76" rx="9" fill="none" stroke="#8b1a1a" stroke-width="1.5"/>
  <!-- 日历页（档案金线框，放大为主角） -->
  <rect x="30" y="32" width="68" height="58" rx="5" fill="#f0e9d8" stroke="#c9a962" stroke-width="2.5"/>
  <!-- 朱砂表头条 -->
  <rect x="30" y="32" width="68" height="16" rx="4" fill="#8b1a1a"/>
  <!-- 装订孔 -->
  <circle cx="43" cy="44" r="3" fill="#f0e9d8"/>
  <circle cx="85" cy="44" r="3" fill="#f0e9d8"/>
  <!-- 星火（朱砂四角星） -->
  <polygon points="64,59 66.9,66.1 74,69 66.9,71.9 64,79 61.1,71.9 54,69 61.1,66.1" fill="#8b1a1a"/>
  <!-- 日期短线（档案金） -->
  <rect x="38" y="84" width="16" height="3" rx="1.5" fill="#c9a962"/>
  <rect x="60" y="84" width="28" height="3" rx="1.5" fill="#c9a962"/>
</svg>
